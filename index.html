<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой ИИ Сайт</title>
<!-- Подключаем библиотеку для бесплатного ИИ -->
<script src="https://js.puter.com/v2/"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #2d2b55);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .chat {
    width: 100%; max-width: 600px; height: 85vh;
    background: #fff; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .header {
    background: #2d2b55; color: #fff; padding: 20px;
    font-size: 20px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .header .dot { width: 12px; height: 12px; border-radius: 50%; background: #4ade80; }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    background: #f9f9fc;
  }
  .msg {
    max-width: 85%; padding: 14px 18px; border-radius: 20px;
    font-size: 16px; line-height: 1.5; word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bot {
    align-self: flex-start; background: #fff; color: #222;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .user {
    align-self: flex-end; background: #2d2b55; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .input-row {
    display: flex; padding: 16px; gap: 10px;
    background: #fff; border-top: 1px solid #e5e7eb;
  }
  input[type=text] {
    flex: 1; padding: 14px 20px; border: 1px solid #e5e7eb;
    border-radius: 30px; outline: none; font-size: 16px;
  }
  input[type=text]:focus { border-color: #2d2b55; }
  button {
    padding: 0 24px; border: none; border-radius: 30px;
    background: #2d2b55; color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #1e1c3a; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .typing { font-style: italic; color: #888; }
</style>
</head>
<body>
<div class="chat">
  <div class="header"><span class="dot"></span> Мой ИИ Ассистент</div>
  <div class="messages" id="messages">
    <div class="msg bot">Привет! Я нейросеть, работающая прямо на этом сайте. Спрашивай что угодно! 🧠✨</div>
  </div>
  <div class="input-row">
    <input type="text" id="input" placeholder="Напиши вопрос..." autocomplete="off">
    <button id="send" type="button" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

// История для памяти бота
let chatHistory = [];

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  // Добавляем сообщение пользователя
  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;
  
  // Показываем, что бот "думает"
  const typing = addMessage("Думает...", 'bot typing');

  chatHistory.push({ role: "user", content: text });

  try {
    // Отправляем запрос в Puter.js
    const response = await puter.ai.chat(chatHistory);

    // Убираем надпись "Думает..."
    typing.remove();
    
    // Проверяем, что ответ пришел и он не пустой
    if (response && response.message && response.message.content) {
      const botReply = response.message.content;
      addMessage(botReply, 'bot');
      chatHistory.push({ role: "assistant", content: botReply });
    } else {
      throw new Error("Пустой ответ от нейросети.");
    }

  } catch (error) {
    typing.remove();
    // Если произошла ошибка, выводим её
    addMessage("⚠️ Ошибка: " + (error.message || "не удалось получить ответ. Попробуй отключить VPN или блокировщик рекламы."), 'bot');
  } finally {
    // Включаем кнопку обратно
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// Отправка по нажатию на Enter
inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
