const WORLDS=Array.from({length:100},(_,i)=>({name:['Пепельные земли','Ледяная долина','Забытый лес','Неоновый город','Пустыня титанов','Остров штормов','Механический мир','Королевство теней'][i%8],icon:['🌋','❄️','🌲','🌆','🏜️','🌊','🏭','🌑'][i%8]}));
const ITEMS=Array.from({length:10000},(_,i)=>{const r=i%100<60?0:i%100<85?1:i%100<97?2:3;const slot=['weapon','armor','artifact'][i%3];return{id:i+1,name:`${['Клинок','Доспех','Артефакт','Молот','Лук','Кристалл'][i%6]} ${i+1}`,icon:['⚔️','🛡️','💎','🔨','🏹','🔮'][i%6],rarity:rarityNames[r],rarityClass:rarityClass[r],bonus:5+Math.floor(i*1.7)*(r+1),cost:80+Math.floor(i*13),slot,equipped:false}});
setInterval(()=>{s.stats.totalPlayTime=(s.stats.totalPlayTime||0)+1;s.stats.maxStage=Math.max(s.stats.maxStage||1,s.stage);const e=currentEnemy();const d=Math.max(0,totalHeroDamage()/10)*(rageActive()?3:1);if(d>0){if(e.boss){s.boss.hp-=d;if(s.boss.hp<=0)killBoss()}else{setEnemyHp(e.hp-d);if(e.hp-d<=0)killEnemy()}save();if(s.activeTab==='battle')render()}} ,1000);
setInterval(()=>{const e=currentEnemy();if(e.boss){s.boss.time-=1;if(e.ability===3&&s.boss.hp>0)s.boss.hp=Math.min(s.boss.maxHp,s.boss.hp+Math.floor(s.boss.maxHp*0.008));if(e.ability===1&&s.boss.hp>0)s.boss.hp=Math.min(s.boss.maxHp,s.boss.hp+Math.floor(s.boss.maxHp*0.004));if(s.boss.time<=0){s.boss={active:false,hp:0,maxHp:0,time:60,regen:0,ability:0};s.combo=0;toast('⏱️ Время вышло! Босс восстановился.');}save();if(s.activeTab==='battle')render()}},1000);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.code==='Space'){e.preventDefault();attack()}if(e.key.toLowerCase()==='r')useRage()});
// TAP ANYWHERE: in battle, any empty area of the page attacks.
document.addEventListener('pointerdown',e=>{if(s.activeTab!=='battle')return;if(e.pointerType==='mouse'&&e.button!==0)return;const t=e.target;if(t.closest('button,a,input,textarea,select,label,[data-act],[data-hero],[data-buy],[data-equip],[data-quest],[data-page-type],[data-search-type]'))return;attack();},{passive:true});
setInterval(()=>save(),5000);

render();
</script>
<script>
(function(){
  const enemy=document.getElementById('enemy');
  if(!enemy)return;
  const mark=(cls,ms)=>{enemy.classList.add(cls);setTimeout(()=>enemy.classList.remove(cls),ms);};
  const oldAdd=enemy.classList.add.bind(enemy.classList);
  enemy.classList.add=function(...xs){oldAdd(...xs);if(xs.includes('hit'))mark('hit-blur',110);};
})();
</script>
