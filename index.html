<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background-color: #f7f9f9;
    background-image: linear-gradient(#e0e6ed 1px, transparent 1px), linear-gradient(90deg, #e0e6ed 1px, transparent 1px);
    background-size: 24px 24px; background-position: center top;
    font-family: 'Caveat', cursive, sans-serif; color: #000; padding: 20px; overflow-x: hidden;
  }
  .app { display: flex; gap: 30px; width: 100%; max-width: 900px; height: 600px; }
  .sketch-box {
    border: 3px solid #000; background: rgba(255, 255, 255, 0.95);
    border-radius: 2px 10px 3px 12px; padding: 20px; box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
  }
  .sidebar { flex: 0 0 280px; display: flex; flex-direction: column; gap: 15px; }
  .logo-box { display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700; height: 80px; transform: rotate(-1deg); }
  .profile-box { flex: 1; display: flex; flex-direction: column; gap: 12px; transform: rotate(0.5deg); }
  .nickname-input {
    font-family: inherit; font-size: 26px; font-weight: 700; border: none;
    border-bottom: 2px dashed #999; background: transparent; outline: none;
    width: 100%; color: #000; padding: 0 0 2px 0; margin-bottom: 5px; text-align: center;
  }
  .nickname-input:focus { border-bottom-color: #000; }
  .rank-info { display: flex; align-items: center; gap: 15px; font-size: 24px; }
  .avatar-container {
    width: 60px; height: 60px; flex-shrink: 0; border: 3px solid #000; border-radius: 2px 12px 4px 10px;
    position: relative; cursor: pointer; overflow: hidden; background: #fff;
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
  }
  .avatar-container:hover { transform: scale(1.05) rotate(2deg); }
  .avatar-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .avatar-emoji { font-size: 34px; pointer-events: none; }
  .avatar-hint {
    position: absolute; bottom: 0; right: 0; background: rgba(255, 255, 255, 0.9);
    font-size: 14px; padding: 1px 3px; border-top-left-radius: 4px; border-left: 1px solid #000; border-top: 1px solid #000; pointer-events: none;
  }
  .level-text { font-size: 18px; color: #333; }
  .xp-bar { height: 10px; border: 2px solid #000; border-radius: 2px 8px 3px 6px; position: relative; background: #fff; overflow: hidden; }
  .xp-fill { height: 100%; background: #000; width: 0%; transition: width 0.3s ease; }
  .stats { font-size: 18px; line-height: 1.3; display: flex; flex-direction: column; gap: 3px; }
  .mode-selector { display: flex; gap: 5px; margin-top: 5px; }
  .mode-btn {
    flex: 1; padding: 6px 4px; font-family: inherit; font-size: 15px; font-weight: 700;
    border: 2px solid #000; border-radius: 4px 10px 5px 8px; background: #fff; cursor: pointer; transition: 0.1s;
  }
  .mode-btn.active { background: #000; color: #fff; }
  .mode-btn:hover { transform: scale(1.02); }
  .side-selector { display: flex; align-items: center; gap: 10px; font-size: 18px; }
  .side-btn {
    flex: 1; padding: 4px; font-family: inherit; font-size: 22px; font-weight: 700;
    border: 2px solid #000; border-radius: 4px 10px 5px 8px; background: #fff; cursor: pointer; transition: 0.1s;
  }
  .side-btn.active { background: #000; }
  .side-btn.active#btn-side-x { color: #4dd4ff !important; }
  .side-btn.active#btn-side-o { color: #ff6ec7 !important; }
  .side-btn:hover { transform: scale(1.05); }
  .play-btn-box {
    height: 70px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 36px; font-weight: 700; transform: rotate(-0.5deg);
    transition: transform 0.1s; user-select: none;
  }
  .play-btn-box:hover { transform: rotate(1deg) scale(1.02); }
  .play-btn-box:active { transform: scale(0.98); }
  .main-area { flex: 1; display: flex; flex-direction: column; position: relative; transform: rotate(0.5deg); padding: 30px; }
  .area-title { position: absolute; top: -20px; left: 30px; background: #fff; padding: 0 10px; font-size: 32px; font-weight: 700; }
  .screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .screen.hidden { display: none; }
  .lobby-container { display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center; width: 100%; max-width: 300px; }
  .code-input {
    font-family: inherit; font-size: 40px; text-align: center; text-transform: uppercase;
    width: 180px; border: 3px solid #000; border-radius: 5px 15px 6px 12px;
    background: #fff; padding: 5px; margin-bottom: 10px; outline: none; letter-spacing: 5px;
  }
  .room-code-text { font-size: 48px; font-weight: 700; letter-spacing: 5px; margin: 10px 0; background: #fff; padding: 5px 15px; border: 3px dashed #000; border-radius: 10px; }
  .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; margin-top: 10px; }
  .cell {
    display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 700;
    border: 3px solid #000; border-radius: 4px 12px 5px 15px; cursor: pointer; user-select: none;
    background: #fff; transition: transform 0.1s;
  }
  .cell:nth-child(1) { border-radius: 10px 4px 15px 5px; transform: rotate(-1deg); }
  .cell:nth-child(2) { border-radius: 3px 12px 4px 10px; transform: rotate(1deg); }
  .cell:nth-child(3) { border-radius: 8px 3px 12px 4px; transform: rotate(-0.5deg); }
  .cell:nth-child(4) { border-radius: 5px 15px 4px 12px; transform: rotate(0.5deg); }
  .cell:nth-child(5) { border-radius: 12px 4px 10px 3px; transform: rotate(-1.5deg); }
  .cell:nth-child(6) { border-radius: 4px 10px 3px 15px; transform: rotate(1deg); }
  .cell:nth-child(7) { border-radius: 15px 5px 12px 4px; transform: rotate(-0.5deg); }
  .cell:nth-child(8) { border-radius: 3px 12px 5px 10px; transform: rotate(0.5deg); }
  .cell:nth-child(9) { border-radius: 10px 4px 15px 3px; transform: rotate(-1deg); }
  .cell:hover:not(.filled) { background: #f0f0f0; }
  .cell.filled, .cell.locked { cursor: default; }
  .cell.x { color: #0055ff; }
  .cell.o { color: #ff0000; }
  .cell.win { background: #000; color: #fff !important; }
  .game-status { font-size: 28px; font-weight: 700; margin-bottom: 20px; min-height: 40px; }
  .back-btn {
    position: absolute; top: 10px; right: 15px; font-size: 22px; cursor: pointer;
    text-decoration: underline; border: none; background: none; font-family: inherit; color: #555;
  }
  .back-btn:hover { color: #000; }
  .restart-btn { position: absolute; bottom: 15px; padding: 8px 20px; font-size: 20px; display: none; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px);
    background: #fff; border: 3px solid #000; border-radius: 5px 15px 6px 12px;
    padding: 15px 30px; font-size: 24px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
    z-index: 100; box-shadow: 4px 4px 0px rgba(0,0,0,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 768px) {
    body { padding: 10px; align-items: flex-start; }
    .app { flex-direction: column; height: auto; gap: 15px; }
    .sidebar { flex: none; }
    .logo-box { height: 60px; font-size: 36px; }
    .play-btn-box { height: 60px; }
    .main-area { min-height: 450px; padding: 20px; }
    .area-title { left: 20px; font-size: 28px; }
    .board { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
    .cell { font-size: 60px; }
  }
</style>
</head>
<body>

<div class="app">
  <input type="file" id="avatar-input" accept="image/*" style="display: none;">
  <div class="sidebar">
    <div class="sketch-box logo-box">игра</div>
    <div class="sketch-box profile-box" id="profile-panel">
      <input type="text" id="nickname-input" class="nickname-input" maxlength="15" placeholder="Ваш ник">
      <div class="rank-info">
        <div class="avatar-container" id="avatar-box" title="Нажми, чтобы сменить аватар">
          <span class="avatar-emoji" id="avatar-emoji">🐣</span>
          <img id="avatar-img" src="" alt="Аватар">
          <div class="avatar-hint">📷</div>
        </div>
        <div>
          <div id="rank-name" style="font-weight:700;">Новичок</div>
          <div class="level-text">Ур. <span id="level-num">1</span></div>
        </div>
      </div>
      <div>
        <div style="font-size:16px; display:flex; justify-content:space-between;">
          <span>Опыт:</span>
          <span><span id="xp-current">0</span> / <span id="xp-needed">20</span></span>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
      </div>
      <div class="stats">
        <div>Побед: <span id="stat-wins">0</span></div>
        <div>Ничьих: <span id="stat-draws">0</span></div>
        <div>Поражений: <span id="stat-losses">0</span></div>
      </div>
      <div class="mode-selector">
        <button class="mode-btn active" id="btn-mode-bot">бот</button>
        <button class="mode-btn" id="btn-mode-friend">друг</button>
        <button class="mode-btn" id="btn-mode-online">сеть</button>
      </div>
      <div class="side-selector">
        <span>играю за:</span>
        <button class="side-btn active" id="btn-side-x" style="color: #0055ff;">X</button>
        <button class="side-btn" id="btn-side-o" style="color: #ff0000;">O</button>
      </div>
      <div style="margin-top:auto; font-size:16px; color:#777; text-decoration:underline; cursor:pointer;" onclick="resetProgress()">Сбросить прогресс</div>
    </div>
    <div class="sketch-box play-btn-box" id="play-btn">играть</div>
  </div>

  <div class="sketch-box main-area">
    <div class="area-title" id="area-title">Стол</div>
    <div class="screen hidden" id="lobby-screen">
      <button class="back-btn" id="lobby-back-btn">← отмена</button>
      <div class="lobby-container" id="lobby-initial">
        <button class="mode-btn" id="btn-create-room" style="font-size:24px; padding:15px;">Создать игру</button>
        <button class="mode-btn" id="btn-join-room" style="font-size:24px; padding:15px;">Войти по коду</button>
      </div>
      <div class="lobby-container hidden" id="lobby-waiting">
        <div style="font-size: 24px;">Код для друга:</div>
        <div id="room-code-display" class="room-code-text">-----</div>
        <div id="waiting-status" style="font-size: 20px; color: #555;">Ожидание подключения...</div>
      </div>
      <div class="lobby-container hidden" id="lobby-join">
        <input type="text" id="join-code-input" class="code-input" maxlength="5" placeholder="КОД">
        <button class="mode-btn" id="btn-connect" style="font-size:24px; padding:10px;">Подключиться</button>
      </div>
    </div>
    <div class="screen hidden" id="game-screen">
      <button class="back-btn" id="back-btn">← выйти</button>
      <div class="game-status" id="status">Ваш ход</div>
      <div class="board" id="board"></div>
      <button class="mode-btn restart-btn" id="btn-restart">Заново</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('PWA:', err));
    });
  }

  const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const BASE_RANKS = [
    { name: 'Новичок', icon: '🐣' }, { name: 'Ученик', icon: '📘' },
    { name: 'Любитель', icon: '🎮' }, { name: 'Знаток', icon: '🔍' },
    { name: 'Опытный', icon: '🎯' }, { name: 'Профи', icon: '⚡' },
    { name: 'Эксперт', icon: '🔥' }, { name: 'Мастер', icon: '🏆' },
    { name: 'Гроссмейстер', icon: '👑' }, { name: 'Легенда', icon: '🌟' },
  ];

  function getRank(level) {
    if (level <= BASE_RANKS.length) return BASE_RANKS[level - 1];
    return { name: `Легенда +${level - BASE_RANKS.length}`, icon: '🌟' };
  }

  const XP_WIN = 12, XP_DRAW = 4, XP_LOSS = 1;
  const STORAGE_KEY = 'ttt-sketch-v1', AVATAR_KEY = 'ttt-avatar-v1', NICK_KEY = 'ttt-nickname-v1';

  let progress = loadProgress(), board = Array(9).fill(null);
  let gameOver = false, busy = false, currentPlayer = 'X';
  let playMode = 'bot', playerSide = 'X', toastTimer = null;
  let peer = null, conn = null, myMark = 'X', opponentNickname = 'Соперник', networkGameActive = false;

  const els = {
    nicknameInput: document.getElementById('nickname-input'), avatarBox: document.getElementById('avatar-box'),
    avatarImg: document.getElementById('avatar-img'), avatarEmoji: document.getElementById('avatar-emoji'),
    avatarInput: document.getElementById('avatar-input'), rankName: document.getElementById('rank-name'),
    levelNum: document.getElementById('level-num'), xpCurrent: document.getElementById('xp-current'),
    xpNeeded: document.getElementById('xp-needed'), xpFill: document.getElementById('xp-fill'),
    statWins: document.getElementById('stat-wins'), statDraws: document.getElementById('stat-draws'),
    statLosses: document.getElementById('stat-losses'), btnModeBot: document.getElementById('btn-mode-bot'),
    btnModeFriend: document.getElementById('btn-mode-friend'), btnModeOnline: document.getElementById('btn-mode-online'),
    btnSideX: document.getElementById('btn-side-x'), btnSideO: document.getElementById('btn-side-o'),
    playBtn: document.getElementById('play-btn'), lobbyScreen: document.getElementById('lobby-screen'),
    gameScreen: document.getElementById('game-screen'), backBtn: document.getElementById('back-btn'),
    lobbyBackBtn: document.getElementById('lobby-back-btn'), lobbyInitial: document.getElementById('lobby-initial'),
    lobbyWaiting: document.getElementById('lobby-waiting'), lobbyJoin: document.getElementById('lobby-join'),
    roomCodeDisplay: document.getElementById('room-code-display'), waitingStatus: document.getElementById('waiting-status'),
    joinCodeInput: document.getElementById('join-code-input'), btnCreateRoom: document.getElementById('btn-create-room'),
    btnJoinRoom: document.getElementById('btn-join-room'), btnConnect: document.getElementById('btn-connect'),
    btnRestart: document.getElementById('btn-restart'), areaTitle: document.getElementById('area-title'),
    board: document.getElementById('board'), status: document.getElementById('status'), toast: document.getElementById('toast')
  };

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.addEventListener('click', () => onCellClick(i));
    els.board.appendChild(c);
    cells.push(c);
  }

  function loadNickname() { els.nicknameInput.value = localStorage.getItem(NICK_KEY) || 'Игрок'; }
  els.nicknameInput.addEventListener('input', () => localStorage.setItem(NICK_KEY, els.nicknameInput.value.trim() || 'Игрок'));
  els.nicknameInput.addEventListener('blur', () => { if (els.nicknameInput.value.trim() === '') els.nicknameInput.value = 'Игрок'; });
  function getMyNickname() { return localStorage.getItem(NICK_KEY) || 'Игрок'; }

  function setMode(mode) {
    playMode = mode;
    els.btnModeBot.classList.toggle('active', mode === 'bot');
    els.btnModeFriend.classList.toggle('active', mode === 'friend');
    els.btnModeOnline.classList.toggle('active', mode === 'online');
    if (mode !== 'online') { resetLobby(); els.lobbyScreen.classList.add('hidden'); }
  }
  function setSide(side) {
    playerSide = side;
    els.btnSideX.classList.toggle('active', side === 'X');
    els.btnSideO.classList.toggle('active', side === 'O');
    if (!els.gameScreen.classList.contains('hidden')) resetGame();
  }

  els.btnModeBot.addEventListener('click', () => setMode('bot'));
  els.btnModeFriend.addEventListener('click', () => setMode('friend'));
  els.btnModeOnline.addEventListener('click', () => setMode('online'));
  els.btnSideX.addEventListener('click', () => setSide('X'));
  els.btnSideO.addEventListener('click', () => setSide('O'));

  function loadAvatar() {
    const saved = localStorage.getItem(AVATAR_KEY);
    if (saved) { els.avatarImg.src = saved; els.avatarImg.style.display = 'block'; els.avatarEmoji.style.display = 'none'; }
  }
  els.avatarBox.addEventListener('click', () => els.avatarInput.click());
  els.avatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 150; let width = img.width, height = img.height;
        if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
        else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        els.avatarImg.src = dataUrl; els.avatarImg.style.display = 'block'; els.avatarEmoji.style.display = 'none';
        localStorage.setItem(AVATAR_KEY, dataUrl); showToast('Аватар обновлен!');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function loadProgress() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return { totalXp: raw.totalXp || 0, wins: raw.wins || 0, draws: raw.draws || 0, losses: raw.losses || 0 };
    } catch { return { totalXp: 0, wins: 0, draws: 0, losses: 0 }; }
  }
  function saveProgress() { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }

  function getLevelInfo(totalXp) {
    let level = 1, acc = 0, need = 20;
    const safeXp = Math.min(totalXp, 1e12); 
    while (safeXp >= acc + need) { acc += need; level++; need = level * 20; if (level > 100000) break; }
    return { level, rank: getRank(level), inLevel: Math.min(totalXp - acc, need), needed: need };
  }

  function addXp(amount) {
    const before = getLevelInfo(progress.totalXp).level;
    progress.totalXp += amount;
    const after = getLevelInfo(progress.totalXp).level;
    saveProgress();
    if (after > before) showToast(`${getRank(after).icon} Новый уровень: ${after} — ${getRank(after).name}!`);
    renderProfile();
  }

  function getBotMode() {
    const lvl = getLevelInfo(progress.totalXp).level;
    if (lvl <= 2) return 'easy';
    if (lvl <= 4) return 'medium';
    return 'hard';
  }

  function renderProfile() {
    const info = getLevelInfo(progress.totalXp);
    if (els.avatarImg.style.display !== 'block') els.avatarEmoji.textContent = info.rank.icon;
    els.rankName.textContent = info.rank.name; els.levelNum.textContent = info.level;
    els.xpCurrent.textContent = info.inLevel; els.xpNeeded.textContent = info.needed;
    els.xpFill.style.width = Math.min(100, (info.inLevel / info.needed) * 100) + '%';
    els.statWins.textContent = progress.wins; els.statDraws.textContent = progress.draws; els.statLosses.textContent = progress.losses;
  }

  function showToast(text) {
    els.toast.textContent = text; els.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => els.toast.classList.remove('show'), 3000);
  }

  window.resetProgress = function() {
    if (confirm('Стереть весь прогресс? (Аватар и ник останутся)')) {
      progress = { totalXp: 0, wins: 0, draws: 0, losses: 0 };
      saveProgress(); renderProfile(); showToast('Прогресс стерт');
    }
  };

  els.playBtn.addEventListener('click', () => {
    if (playMode === 'online') {
      els.gameScreen.classList.add('hidden'); els.lobbyScreen.classList.remove('hidden');
      els.areaTitle.textContent = 'по сети'; resetLobby();
    } else {
      els.lobbyScreen.classList.add('hidden'); els.gameScreen.classList.remove('hidden');
      els.areaTitle.textContent = 'игра'; resetGame();
    }
  });

  els.backBtn.addEventListener('click', () => {
    if (playMode === 'online') resetLobby();
    els.gameScreen.classList.add('hidden'); els.lobbyScreen.classList.add('hidden');
    els.areaTitle.textContent = 'Стол'; renderProfile();
  });
  
  els.lobbyBackBtn.addEventListener('click', () => {
    resetLobby(); els.lobbyScreen.classList.add('hidden'); els.areaTitle.textContent = 'Стол';
  });

  els.btnRestart.addEventListener('click', () => {
    if (playMode === 'online') { if (conn && conn.open) conn.send({ type: 'restart' }); resetNetworkGame(); }
  });

  function resetLobby() {
    if (peer) { peer.destroy(); peer = null; }
    if (conn) { conn.close(); conn = null; }
    networkGameActive = false; opponentNickname = 'Соперник'; els.btnRestart.style.display = 'none';
    els.lobbyInitial.classList.remove('hidden'); els.lobbyWaiting.classList.add('hidden'); els.lobbyJoin.classList.add('hidden');
    els.roomCodeDisplay.textContent = '-----'; els.waitingStatus.textContent = 'Ожидание подключения...'; els.joinCodeInput.value = '';
  }

  els.btnCreateRoom.addEventListener('click', () => {
    const code = Math.random().toString(36).substring(2, 7).toUpperCase();
    els.roomCodeDisplay.textContent = code; els.lobbyInitial.classList.add('hidden'); els.lobbyWaiting.classList.remove('hidden');
    peer = new Peer('ttt-' + code);
    peer.on('open', () => console.log('Комната создана:', code));
    peer.on('connection', (connection) => { conn = connection; myMark = playerSide; setupConnection(); });
    peer.on('error', (err) => { showToast('Ошибка: ' + err.type); resetLobby(); });
  });

  els.btnJoinRoom.addEventListener('click', () => {
    els.lobbyInitial.classList.add('hidden'); els.lobbyJoin.classList.remove('hidden'); els.joinCodeInput.focus();
  });

  els.btnConnect.addEventListener('click', () => {
    const code = els.joinCodeInput.value.trim().toUpperCase();
    if (code.length < 5) { showToast('Введите 5-значный код'); return; }
    els.lobbyJoin.classList.add('hidden'); els.lobbyWaiting.classList.remove('hidden');
    els.roomCodeDisplay.textContent = code; els.waitingStatus.textContent = 'Подключение...';
    peer = new Peer();
    peer.on('open', () => { conn = peer.connect('ttt-' + code); setupConnection(); });
    peer.on('error', (err) => { if (err.type === 'peer-unavailable') showToast('Комната не найдена'); else showToast('Ошибка: ' + err.type); resetLobby(); });
  });

  function setupConnection() {
    if (conn.open) onConnectionOpen(); else conn.on('open', onConnectionOpen);
    conn.on('data', (data) => {
      if (data.type === 'init') {
        myMark = data.hostSide === 'X' ? 'O' : 'X'; opponentNickname = data.hostNick || 'Соперник';
        conn.send({ type: 'guestInfo', guestNick: getMyNickname() }); showToast('Соперник: ' + opponentNickname); startNetworkGame();
      } else if (data.type === 'guestInfo') {
        opponentNickname = data.guestNick || 'Соперник'; showToast('Соперник: ' + opponentNickname);
      } else if (data.type === 'move') {
        board = data.board; currentPlayer = data.nextPlayer; updateBoardUI();
        if (checkGameEndNetwork()) return; updateStatus();
      } else if (data.type === 'restart') { resetNetworkGame(); }
    });
    conn.on('close', () => {
      showToast('Соперник отключился'); resetLobby(); els.gameScreen.classList.add('hidden');
      els.lobbyScreen.classList.remove('hidden'); els.areaTitle.textContent = 'по сети';
    });
  }

  function onConnectionOpen() {
    if (myMark === playerSide) {
      conn.send({ type: 'init', hostSide: playerSide, hostNick: getMyNickname() }); startNetworkGame();
    }
  }

  function startNetworkGame() {
    networkGameActive = true; els.lobbyScreen.classList.add('hidden'); els.gameScreen.classList.remove('hidden');
    els.areaTitle.textContent = 'игра по сети'; els.btnRestart.style.display = 'block'; resetNetworkGame();
  }

  function resetNetworkGame() {
    board = Array(9).fill(null); gameOver = false; currentPlayer = 'X'; updateBoardUI(); updateStatus();
  }

  function updateStatus() {
    if (!networkGameActive) return;
    if (currentPlayer === myMark) setStatus('Ваш ход'); else setStatus('Ход ' + opponentNickname);
  }

  function resetGame() {
    board = Array(9).fill(null); gameOver = false; busy = false; currentPlayer = 'X';
    cells.forEach(c => { c.className = 'cell'; c.textContent = ''; });
    if (playMode === 'bot') {
      if (playerSide === 'X') setStatus('Ваш ход');
      else { setStatus('ИИ думает...'); busy = true; setTimeout(aiTurn, 400); }
    } else if (playMode === 'friend') setStatus('Ход X');
  }

  function setStatus(text) { els.status.textContent = text; }
  function updateBoardUI() {
    for (let i = 0; i < 9; i++) {
      const cell = cells[i], val = board[i];
      if (val) { cell.className = 'cell filled ' + val.toLowerCase(); cell.textContent = val; }
      else { cell.className = 'cell'; cell.textContent = ''; }
    }
  }

  function onCellClick(i) {
    if (gameOver || busy || board[i] !== null) return;
    if (playMode === 'online') {
      if (!networkGameActive || currentPlayer !== myMark) return;
      board[i] = myMark; updateBoardUI(); currentPlayer = myMark === 'X' ? 'O' : 'X';
      if (conn && conn.open) conn.send({ type: 'move', board: board, nextPlayer: currentPlayer });
      if (checkGameEndNetwork()) return; updateStatus();
    } else if (playMode === 'bot') {
      if (currentPlayer !== playerSide) return;
      place(i, playerSide); if (finishIfNeeded()) return;
      currentPlayer = playerSide === 'X' ? 'O' : 'X'; setStatus('ИИ думает...');
      busy = true; setTimeout(aiTurn, 400);
    } else {
      place(i, currentPlayer); if (finishIfNeeded()) return;
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X'; setStatus('Ход ' + currentPlayer);
    }
  }

  function place(i, mark) {
    board[i] = mark; const cell = cells[i]; cell.classList.add('filled', mark.toLowerCase()); cell.textContent = mark;
  }

  function aiTurn() {
    if (gameOver) { busy = false; return; }
    const botMark = playerSide === 'X' ? 'O' : 'X', idx = pickAiMove(botMark, playerSide);
    if (idx === null) { busy = false; return; }
    place(idx, botMark); busy = false;
    if (finishIfNeeded()) return; currentPlayer = playerSide; setStatus('Ваш ход');
  }

  function finishIfNeeded() {
    const { winner, line } = checkWinner(board);
    if (winner) {
      gameOver = true; lockAll(); line.forEach(i => cells[i].classList.add('win'));
      if (playMode === 'bot') {
        if (winner === playerSide) { progress.wins++; setStatus(`Победа! +${XP_WIN} XP`); addXp(XP_WIN); }
        else { progress.losses++; setStatus(`Поражение... +${XP_LOSS} XP`); addXp(XP_LOSS); }
      } else setStatus(`Победили ${winner === 'X' ? 'Крестики' : 'Нолики'}!`);
      saveProgress(); return true;
    }
    if (board.every(Boolean)) {
      gameOver = true; lockAll();
      if (playMode === 'bot') { progress.draws++; setStatus(`Ничья. +${XP_DRAW} XP`); addXp(XP_DRAW); }
      else setStatus('Ничья!');
      saveProgress(); return true;
    }
    return false;
  }

  function checkGameEndNetwork() {
    const { winner, line } = checkWinner(board);
    if (winner) {
      gameOver = true; lockAll(); line.forEach(i => cells[i].classList.add('win'));
      setStatus(winner === myMark ? 'Вы победили! 🎉' : 'Вы проиграли 😢'); return true;
    }
    if (board.every(Boolean)) { gameOver = true; lockAll(); setStatus('Ничья'); return true; }
    return false;
  }

  function lockAll() { cells.forEach(c => { if (!c.classList.contains('filled')) c.classList.add('locked'); }); }
  function checkWinner(b) {
    for (const line of WIN_LINES) {
      const [a, c, d] = line; if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line };
    }
    return { winner: null, line: [] };
  }

  function pickAiMove(botMark, humanMark) {
    const empty = []; for (let i = 0; i < 9; i++) if (!board[i]) empty.push(i);
    if (empty.length === 0) return null;
    const mode = getBotMode();
    if (mode === 'easy') return empty[Math.floor(Math.random() * empty.length)];
    if (mode === 'medium') return heuristicMove(empty, botMark, humanMark);
    return minimaxMove(botMark, humanMark);
  }

  function heuristicMove(empty, botMark, humanMark) {
    for (const i of empty) { board[i] = botMark; if (checkWinner(board).winner === botMark) { board[i] = null; return i; } board[i] = null; }
    for (const i of empty) { board[i] = humanMark; if (checkWinner(board).winner === humanMark) { board[i] = null; return i; } board[i] = null; }
    if (empty.includes(4)) return 4;
    const corners = [0, 2, 6, 8].filter(i => empty.includes(i));
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    return empty[Math.floor(Math.random() * empty.length)];
  }

  function minimaxMove(botMark, humanMark) {
    let bestScore = -Infinity, bestIdx = null;
    for (let i = 0; i < 9; i++) {
      if (board[i]) continue; board[i] = botMark;
      const s = minimax(board, 0, false, botMark, humanMark); board[i] = null;
      if (s > bestScore) { bestScore = s; bestIdx = i; }
    }
    return bestIdx;
  }

  function minimax(b, depth, isMax, botMark, humanMark) {
    const { winner } = checkWinner(b);
    if (winner === botMark) return 10 - depth; if (winner === humanMark) return depth - 10;
    if (b.every(Boolean)) return 0;
    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) { if (b[i]) continue; b[i] = botMark; best = Math.max(best, minimax(b, depth + 1, false, botMark, humanMark)); b[i] = null; }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) { if (b[i]) continue; b[i] = humanMark; best = Math.min(best, minimax(b, depth + 1, true, botMark, humanMark)); b[i] = null; }
      return best;
    }
  }

  loadNickname(); loadAvatar(); renderProfile();
})();
</script>
