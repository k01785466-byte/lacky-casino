function lockedView(tab){const need=UNLOCK_LEVEL[tab]||1;return `<section class="panel" style="text-align:center;padding:42px 18px"><div class="big">🔒</div><h2>Раздел закрыт</h2><p class="muted">${unlockText(tab)}</p><p>Текущий уровень: <b>${playerLevel()}</b></p><p class="muted">Проходи этапы, чтобы открывать новые возможности.</p></section>`}
const views={battle(){const e=currentEnemy();const pct=clamp((e.hp/e.max)*100,0,100);return `<section class="panel"><div class="hud-title"><span class="muted small">PROJECT TITAN</span><span class="count">OFFLINE · ENDLESS RPG</span></div>${header()}</section><section class="panel enemy combat-stage battle-arena ${e.boss?"boss-frame":""}"><div class="muted">${e.boss?'⚠ БОСС':'⚔ ВРАГ'}</div><div class="enemyIcon">${e.icon}</div><div class="enemy-name">${e.name}</div><div class="enemy-sub">${e.boss?'Элитная цель · не дай таймеру закончиться':'Тапай по арене в любом месте'}</div><div class="hp"><i style="width:${pct}%"></i></div><div>${fmt(Math.max(0,e.hp))} / ${fmt(e.max)} HP</div>${e.boss?`<div class="boss-timer ${e.time<=10?'danger':''}">⏱️ ${Math.ceil(e.time)} сек. · ${['Обычный','Броня','Щит','Регенерация'][e.ability]}</div>`:''}<div class="tap-pill">👆 ТАПАЙ ГДЕ УГОДНО ПО АРЕНЕ</div><div class="battle-actions"><button class="skill" data-act="rage" ${rageReady()?'':'disabled'}>🔥 ЯРОСТЬ ${rageReady()?'· x3 на 5 сек':'· КД'}</button></div></section><section class="combat-grid"><div class="combat-card"><div class="label">Твой урон</div><div class="num">${fmt(powerEstimate()*(rageActive()?3:1))}</div><div class="sub">Крит ${Math.round(s.critChance*100)}% · комбо x${s.combo}</div></div><div class="combat-card"><div class="label">Титан</div><div class="num">ур. ${s.titanLevel}</div><div class="sub">${fmt(s.titanDamage*s.titanLevel)} урона</div></div><div class="combat-card"><div class="label">DPS</div><div class="num">${fmt(dpsEstimate()*(rageActive()?3:1))}</div><div class="sub">Герои атакуют автоматически</div></div></section><section class="upgrade-card"><div class="upgrade-main"><div><div class="upgrade-title">УЛУЧШЕНИЕ ТИТАНА</div><div class="upgrade-level">Уровень ${s.titanLevel} → ${s.titanLevel+1}</div><div class="small muted">Стоимость: 💰 ${fmt(upgradeCost())}</div></div><button class="btn" data-act="upgrade">⬆️ УЛУЧШИТЬ</button></div></section>`},
heroes(){if(!unlocked('heroes'))return lockedView('heroes');const arr=filtered(HEROES,'heroes',h=>h.name.toLowerCase().includes(ui.heroes.search.toLowerCase())||String(HEROES.indexOf(h)+1).includes(ui.heroes.search));const start=(ui.heroes.page-1)*PAGE_SIZE;const page=arr.slice(start,start+PAGE_SIZE);return `<section class="panel"><h2>🦸 Герои</h2><div class="muted">Все ${HEROES.length.toLocaleString()} героев доступны.</div>${searchBox('heroes','🔎 Найти героя или номер')}</section><section class="grid">${page.map(h=>{const id=HEROES.indexOf(h)+1,st=s.heroes[id],c=heroCost(id);const need=heroUnlockLevel(id),ok=playerLevel()>=need;return `<div class="card ${ok?'':'locked-card'}"><div class="heroIcon">${ok?h.icon:'🔒'}</div><h3>${h.name}</h3><div class="muted">Базовый урон: ${fmt(h.damage)}</div><div>${ok?'Ур. '+(st?.level||0):`<span class="lock-label">🔒 Уровень ${need}</span>`}</div>${ok?`<button class="btn" data-hero="${id}">${st?.owned?'⬆️ Улучшить':'🦸 Нанять'} · ${fmt(c)}</button>`:''}</div>`}).join('')}</section>${pageControls('heroes',arr.length)}`},
inventory(){if(!unlocked('inventory'))return lockedView('inventory');const arr=filtered(s.owned,'inventory',id=>{const x=ITEMS[id-1];return x&&x.name.toLowerCase().includes(ui.inventory.search.toLowerCase())});const start=(ui.inventory.page-1)*PAGE_SIZE;const page=arr.slice(start,start+PAGE_SIZE);return `<section class="panel"><h2>🎒 Инвентарь</h2><div class="muted">Предметов: ${s.owned.length.toLocaleString()} / ${ITEMS.length.toLocaleString()}</div>${searchBox('inventory','🔎 Найти предмет')}</section><section class="list">${page.map(id=>{const x=ITEMS[id-1];const need=itemUnlockLevel(id),ok=playerLevel()>=need;return `<div class="item rar-${x.rarityClass} ${ok?'':'locked-card'}"><div>${ok?x.icon:'🔒'}</div><div class="grow"><b>${x.name}</b><div class="small muted">${x.rarity} · +${fmt(x.bonus)} урона · ${x.slot}</div>${ok?'':`<div class="lock-label small">Откроется на уровне ${need}</div>`}</div>${ok?(Object.values(s.equipped).includes(id)?'✅ Надето':`<button class="btn" data-equip="${id}">Надеть</button>`):''}</div>`}).join('')||'<div class="panel muted">Инвентарь пуст.</div>'}</section>${pageControls('inventory',arr.length)}`},
worlds(){if(!unlocked('worlds'))return lockedView('worlds');const arr=filtered(WORLDS,'worlds',w=>w.name.toLowerCase().includes(ui.worlds.search.toLowerCase()));const start=(ui.worlds.page-1)*PAGE_SIZE;const page=arr.slice(start,start+PAGE_SIZE);return `<section class="panel"><h2>🌍 Миры</h2><div class="muted">${s.world} из ${WORLDS.length} открыто.</div>${searchBox('worlds','🔎 Найти мир')}</section><section class="grid">${page.map(w=>{const i=WORLDS.indexOf(w);const need=worldUnlockLevel(i+1),ok=playerLevel()>=need;return `<div class="card ${ok?'':'locked-card'}"><div class="big">${ok?w.icon:'🔒'}</div><h3>Мир ${i+1}: ${w.name}</h3><div class="muted">Этапы ${i*100+1}–${(i+1)*100}</div><div>${ok?(i+1<=s.world?'✅ Открыт':'🔐 Доступен позже'):`<span class="lock-label">🔒 Уровень ${need}</span>`}</div></div>`}).join('')}</section>${pageControls('worlds',arr.length)}`},
bosses(){if(!unlocked('bosses'))return lockedView('bosses');const arr=filtered(BOSSES,'bosses',b=>b.name.toLowerCase().includes(ui.bosses.search.toLowerCase())||String(b.stage).includes(ui.bosses.search));const start=(ui.bosses.page-1)*PAGE_SIZE;const page=arr.slice(start,start+PAGE_SIZE);return `<section class="panel"><h2>👑 Боссы</h2><div>Всего: ${BOSSES.length.toLocaleString()}</div><div class="muted">Каждый 10-й этап — битва с боссом. Лимит: 60 секунд.</div>${searchBox('bosses','🔎 Найти босса или этап')}</section><section class="grid">${page.map(b=>`<div class="card"><div class="big">👑</div><h3>${b.name}</h3><div class="muted">Этап ${b.stage.toLocaleString('ru-RU')} · HP ${fmt(b.hp)}</div></div>`).join('')}</section>${pageControls('bosses',arr.length)}`},
prestige(){if(!unlocked('prestige'))return lockedView('prestige');return `<section class="panel"><h2>⭐ Престиж</h2><p>Сила престижа: <b>${fmt(s.prestigePower)}</b></p><p class="muted">Каждая единица даёт +10 к урону. Комбо x${s.comboBest} · тип урона: ${s.damageType}</p><button class="btn" data-act="prestige">⭐ Престиж</button></section>`},
shop(){if(!unlocked('shop'))return lockedView('shop');const ids=[1+(s.shopSeed%ITEMS.length),1+((s.shopSeed+137)%ITEMS.length),1+((s.shopSeed+911)%ITEMS.length),1+((s.shopSeed+2500)%ITEMS.length),1+((s.shopSeed+7777)%ITEMS.length)];return `<section class="panel"><div class="row"><div><h2>🛒 Магазин</h2><div class="muted">10 000 разных предметов в базе</div></div><button class="btn" data-act="refresh">🔄 Обновить</button></div></section><section class="grid">${ids.map(id=>{const x=ITEMS[id-1],c=itemCost(id);return `<div class="card rar-${x.rarityClass}"><div class="big">${x.icon}</div><h3>${x.name}</h3><div class="muted">${x.rarity} · +${fmt(x.bonus)} урона</div><button class="btn" data-buy="${id}">💰 ${fmt(c)}</button></div>`}).join('')}</section>`},
quests(){if(!unlocked('quests'))return lockedView('quests');const qs=questData();return `<section class="panel"><h2>📜 Задания</h2><div class="muted">Выполняй задания во время обычной игры и получай золото.</div></section><section class="list">${qs.map(q=>{const p=clamp(q.value/q.goal*100,0,100),done=q.value>=q.goal,claimed=!!s.quests.claimed[q.id];return `<div class="quest"><div style="flex:1"><b>${q.name}</b><div class="small muted">${q.desc} · ${Math.min(q.value,q.goal).toLocaleString('ru-RU')} / ${q.goal.toLocaleString('ru-RU')}</div><div class="progress" style="margin-top:7px"><i style="width:${p}%"></i></div></div><button class="btn" data-quest="${q.id}" ${!done||claimed?'disabled':''}>${claimed?'✓ Получено':`+${fmt(q.reward)}`}</button></div>`}).join('')}</section>`},
settings(){if(!unlocked('settings'))return lockedView('settings');return `<section class="panel"><h2>⚙️ Настройки</h2><button class="btn" data-act="save">💾 Сохранить</button> <button class="btn" data-act="reset">🗑️ Сбросить</button></section><section class="panel"><p class="muted">PROJECT TITAN 4.0 · офлайн-сохранение · бесконечные этапы</p><p class="muted">Контент генерируется из базы: ${HEROES.length.toLocaleString()} героев · ${WORLDS.length} миров · ${ITEMS.length.toLocaleString()} предметов · ${BOSSES.length.toLocaleString()} боссов.</p></section>`}}
function wire(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='attack')attack();if(a==='upgrade')upgradeTitan();if(a==='prestige')prestige();if(a==='refresh'){s.shopSeed++;save();render()}if(a==='save'){save();toast('Сохранено')}if(a==='rage')useRage();if(a==='reset')reset()});document.querySelectorAll('[data-sound-toggle]').forEach(b=>b.onclick=toggleSound);document.querySelectorAll('[data-sound-test]').forEach(b=>b.onclick=testSound);const vol=document.getElementById('soundVolume');if(vol){vol.oninput=()=>{setSoundVolume(+vol.value/100);const out=document.getElementById('soundVolumeValue');if(out)out.textContent=vol.value+'%'}}document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>hireHero(+b.dataset.hero));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyItem(+b.dataset.buy));document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>equip(+b.dataset.equip));document.querySelectorAll('[data-quest]').forEach(b=>b.onclick=()=>claimQuest(b.dataset.quest));document.querySelectorAll('[data-page-type]').forEach(b=>b.onclick=()=>{const type=b.dataset.pageType;ui[type].page=+b.dataset.page;render()});document.querySelectorAll('[data-search-type]').forEach(i=>i.oninput=()=>{ui[i.dataset.searchType].search=i.value;ui[i.dataset.searchType].page=1;render()})}
const HEROES=Array.from({length:1000},(_,i)=>({name:['Страж','Охотник','Маг','Рыцарь','Титан','Разведчик','Самурай','Инженер','Монах','Берсерк'][i%10]+` ${i+1}`,icon:['🛡️','🏹','🧙','⚔️','🗿','🕵️','🥷','🤖','🧘','🔥'][i%10],damage:10+Math.floor(i*3.7),cost:100+Math.floor(i*42)}));
const WORLDS=Array.from({length:100},(_,i)=>({name:['Пепельные земли','Ледяная долина','Забытый лес','Неоновый город','Пустыня титанов','Остров штормов','Механический мир','Королевство теней'][i%8],icon:['🌋','❄️','🌲','🌆','🏜️','🌊','🏭','🌑'][i%8]}));
const ITEMS=Array.from({length:10000},(_,i)=>{const r=i%100<60?0:i%100<85?1:i%100<97?2:3;const slot=['weapon','armor','artifact'][i%3];return{id:i+1,name:`${['Клинок','Доспех','Артефакт','Молот','Лук','Кристалл'][i%6]} ${i+1}`,icon:['⚔️','🛡️','💎','🔨','🏹','🔮'][i%6],rarity:rarityNames[r],rarityClass:rarityClass[r],bonus:5+Math.floor(i*1.7)*(r+1),cost:80+Math.floor(i*13),slot,equipped:false}});
const BOSSES=Array.from({length:100000},(_,i)=>({name:`Босс ${i+1}`,stage:(i+1)*10,hp:Math.floor(1500*Math.pow(1.0015,i+1))}));
setInterval(()=>{const e=currentEnemy();const d=Math.max(0,totalHeroDamage()/10)*(rageActive()?3:1);if(d>0){soundAttack();if(e.boss){s.boss.hp-=d;if(s.boss.hp<=0)killBoss()}else{setEnemyHp(e.hp-d);if(e.hp-d<=0)killEnemy()}save();if(s.activeTab==='battle')render()}} ,1000);
setInterval(()=>{const e=currentEnemy();if(e.boss){s.boss.time-=1;if(e.ability===3&&s.boss.hp>0)s.boss.hp=Math.min(s.boss.maxHp,s.boss.hp+Math.floor(s.boss.maxHp*0.008));if(e.ability===1&&s.boss.hp>0)s.boss.hp=Math.min(s.boss.maxHp,s.boss.hp+Math.floor(s.boss.maxHp*0.004));if(s.boss.time<=0){s.boss={active:false,hp:0,maxHp:0,time:60,regen:0,ability:0};s.combo=0;toast('⏱️ Время вышло! Босс восстановился.');}save();if(s.activeTab==='battle')render()}},1000);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.code==='Space'){e.preventDefault();attack()}if(e.key.toLowerCase()==='r')useRage()});
// TAP ANYWHERE: in battle, any empty area of the page attacks.
document.addEventListener('pointerdown',e=>{if(s.activeTab!=='battle')return;if(e.pointerType==='mouse'&&e.button!==0)return;const t=e.target;if(t.closest('button,a,input,textarea,select,label,[data-act],[data-hero],[data-buy],[data-equip],[data-quest],[data-page-type],[data-search-type]'))return;attack();},{passive:true});
setInterval(()=>save(),5000);

render();
</script>
<script>
(function(){
  const enemy=document.getElementById('enemy');
  if(!enemy)return;
  const mark=(cls,ms)=>{enemy.classList.add(cls);setTimeout(()=>enemy.classList.remove(cls),ms);};
  const oldAdd=enemy.classList.add.bind(enemy.classList);
  enemy.classList.add=function(...xs){oldAdd(...xs);if(xs.includes('hit'))mark('hit-blur',110);};
})();
</script>
</body></html>
