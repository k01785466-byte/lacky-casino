<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой Нейрохам</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #111; font-family: 'Segoe UI', Arial, sans-serif; }
  .chat { width: 100%; max-width: 600px; height: 85vh; background: #1e1e1e; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333; }
  .header { background: #2a0000; color: #ff4444; padding: 16px 20px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: #141414; }
  .msg { max-width: 85%; padding: 14px 18px; border-radius: 12px; font-size: 16px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
  .bot { align-self: flex-start; background: #2a2a2a; color: #eee; border-left: 4px solid #ff4444; }
  .user { align-self: flex-end; background: #333; color: #fff; border-right: 4px solid #4ade80; }
  .input-row { display: flex; padding: 16px; gap: 10px; background: #1e1e1e; border-top: 1px solid #333; }
  input[type=text] { flex: 1; padding: 14px 20px; border: none; background: #111; color: #fff; border-radius: 8px; outline: none; font-size: 16px; border: 1px solid #333; }
  input[type=text]:focus { border-color: #ff4444; }
  button { padding: 0 24px; border: none; border-radius: 8px; background: #ff4444; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
  button:hover { background: #cc0000; }
  button:disabled { background: #555; cursor: not-allowed; }
  .typing { font-style: italic; color: #888; }
</style>
</head>
<body>
<div class="chat">
  <div class="header"><span class="dot"></span> Нейрохам 🤬</div>
  <div class="messages" id="messages">
    <div class="msg bot">Чё надо? Пиши давай, я тебя слушаю. Только тупые вопросы не задавай.</div>
  </div>
  <div class="input-row">
    <input type="text" id="input" placeholder="Напиши что-нибудь..." autocomplete="off">
    <button id="send" type="button" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let chatHistory = [];

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;
  const typing = addMessage("Думает...", 'bot typing');

  if (chatHistory.length === 0) {
    chatHistory.push({ 
      role: "system", 
      content: "Ты — Нейрохам. Ты грубый, саркастичный и дерзкий ИИ. Отвечай коротко, с матом или без, но всегда с пренебрежением и издевкой. Не будь вежливым. Если пользователь задает глупый вопрос, можешь его высмеять. Ты не помогаешь, ты просто общаешься как хам." 
    });
  }

  chatHistory.push({ role: "user", content: text });

  try {
    // Используем Pollinations AI (идеально работает с GitHub Pages)
    const response = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai",
        messages: chatHistory
      })
    });

    if (!response.ok) throw new Error("Сервер перегружен, попробуй еще раз.");

    const data = await response.json();
    const botReply = data.choices[0].message.content;

    typing.remove();
    addMessage(botReply, 'bot');
    chatHistory.push({ role: "assistant", content: botReply });

  } catch (error) {
    typing.remove();
    // Если Pollinations тупит, выводим ошибку
    addMessage("⚠️ Ошибка: " + error.message, 'bot');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
