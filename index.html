<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LUCKY SLOTS 🎰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-dark: #0a0d14;
    --bg-panel: #131822;
    --bg-card: #1a2130;
    --border: #242e3f;
    --text: #e8eef5;
    --text-dim: #6a7a92;
    --gold: #ffcb47;
    --green: #22c55e;
    --red: #ef4444;
    --purple: #a855f7;
    --blue: #3b82f6;
    --accent: #ffcb47;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html {
    height: 100%;
    overflow: hidden;
    background: #0a0d14;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a1a10, #0a0d14 60%);
    color: var(--text);
    height: 100%;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: manipulation;
    position: relative;
  }

  /* ============================================================
     АНИМИРОВАННЫЙ ФОН
     ============================================================ */
  #parallax-bg {
    position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,203,71,.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(168,85,247,.06) 0%, transparent 40%);
    animation: parallaxMove 30s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes parallaxMove {
    0%   { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(-3%, -2%, 0) scale(1.05); }
  }

  /* ============================================================
     ОСНОВНОЙ LAYOUT
     ============================================================ */
  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    position: relative;
  }

  /* ============================================================
     ВЕРХНЯЯ ПАНЕЛЬ
     ============================================================ */
  .top-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px 12px;
    background: rgba(10,13,20,.95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    flex-shrink: 0;
    z-index: 10;
  }

  .top-row-1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .profile-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 14px 5px 5px;
    background: linear-gradient(135deg, rgba(168,85,247,.12), rgba(59,130,246,.08));
    border: 1px solid rgba(168,85,247,.35);
    border-radius: 30px;
    cursor: pointer;
    transition: transform .12s, border-color .15s, background .15s;
    font-family: inherit;
    touch-action: manipulation;
    min-width: 0;
  }
  .profile-badge:hover  { border-color: var(--purple); background: linear-gradient(135deg, rgba(168,85,247,.2), rgba(59,130,246,.12)); }
  .profile-badge:active { transform: scale(.96); }

  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    background: linear-gradient(145deg, #2e2038, #180f24);
    border: 2px solid var(--purple);
    box-shadow: 0 0 14px rgba(168,85,247,.5);
    flex-shrink: 0;
    position: relative;
  }

  .profile-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    text-align: left;
  }
  .profile-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
    line-height: 1.1;
  }
  .profile-level {
    font-size: 10px;
    color: var(--purple);
    font-weight: 700;
    line-height: 1.1;
  }

  .balance-hero {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: linear-gradient(135deg, rgba(255,203,71,.15), rgba(255,154,61,.08));
    border: 1px solid var(--gold);
    border-radius: 12px;
    font-weight: 900;
    font-size: 18px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 20px rgba(255,203,71,.2);
  }
  .balance-hero .coin { font-size: 19px; }
  .balance-hero .amount {
    color: var(--gold);
    transition: transform .15s, color .3s;
    will-change: transform;
  }
  .balance-hero .amount.bump { transform: scale(1.15); }
  .balance-hero .amount.win  { color: var(--green); }
  .balance-hero .amount.lose { color: var(--red); }

  .top-row-2 {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mini-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex: 1;
    min-width: 0;
  }
  .mini-stats::-webkit-scrollbar { display: none; }

  .mini-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-weight: 800;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    min-width: 64px;
    flex-shrink: 0;
  }
  .mini-stat .lbl {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-dim);
    font-weight: 700;
    line-height: 1;
    margin-bottom: 3px;
  }
  .mini-stat .val {
    color: var(--gold);
    font-size: 13px;
    white-space: nowrap;
    line-height: 1;
  }
  .mini-stat .val.purple { color: var(--purple); }
  .mini-stat .val.green  { color: var(--green); }
  .mini-stat.pulse {
    border-color: var(--gold);
    animation: jackpotGlow 2s ease-in-out infinite alternate;
  }
  @keyframes jackpotGlow {
    from { box-shadow: 0 0 10px rgba(255,203,71,.15); }
    to   { box-shadow: 0 0 22px rgba(255,203,71,.5); }
  }

  /* ============================================================
     ИГРОВАЯ ЗОНА
     ============================================================ */
  .game-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 0;
    gap: 16px;
    overflow-y: auto;
    position: relative;
  }

  .machine-frame {
    background: linear-gradient(180deg, #1a1225 0%, #0f0a18 100%);
    border: 2px solid #3a2a52;
    border-radius: 26px;
    padding: 20px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.03),
      0 0 90px rgba(168,85,247,.2),
      0 30px 60px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.08);
    position: relative;
    width: 100%;
    max-width: 520px;
    animation: frameGlow 5s ease-in-out infinite alternate;
  }
  @keyframes frameGlow {
    from { box-shadow: 0 0 0 1px rgba(255,255,255,.03), 0 0 90px rgba(168,85,247,.2), 0 30px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); }
    to   { box-shadow: 0 0 0 1px rgba(255,255,255,.03), 0 0 120px rgba(255,203,71,.25), 0 30px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); }
  }

  .machine-frame.shake { animation: machineShake .5s ease-in-out; }
  @keyframes machineShake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    40%     { transform: translateX(8px); }
    60%     { transform: translateX(-5px); }
    80%     { transform: translateX(5px); }
  }

  .freespins-badge {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    padding: 7px 18px;
    background: linear-gradient(135deg, var(--green), #16a34a);
    border-radius: 20px;
    font-size: 12px; font-weight: 800;
    color: #fff;
    box-shadow: 0 0 28px rgba(34,197,94,.8);
    z-index: 5;
    display: none;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .freespins-badge.show { display: block; }

  .reels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 6px;
    position: relative;
  }

  .cell {
    aspect-ratio: 1/1;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,203,71,.06), transparent 60%),
      radial-gradient(circle at 50% 30%, #251a35, #14091e 75%);
    border: 2px solid #3a2a52;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(42px, 11vw, 66px);
    line-height: 1;
    transition: transform .15s ease, box-shadow .3s, border-color .3s;
    position: relative;
    overflow: hidden;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.5);
  }
  .cell.spinning {
    border-color: var(--gold);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.5), 0 0 20px rgba(255,203,71,.3);
  }
  .cell.win {
    background:
      radial-gradient(circle at 50% 20%, rgba(255,203,71,.15), transparent 60%),
      radial-gradient(circle at 50% 30%, #4a3a1a, #2a1f0a 70%);
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(255,203,71,.5), 0 0 40px rgba(255,203,71,.7);
    animation: winPulse .6s ease-in-out infinite alternate;
  }
  @keyframes winPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
  }

  .win-line {
    position: absolute;
    top: 50%;
    left: 8px; right: 8px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(239,68,68,.9), transparent);
    pointer-events: none;
    z-index: 4;
    transform: translateY(-50%);
    opacity: .7;
    box-shadow: 0 0 12px rgba(239,68,68,.8);
  }

  .bet-panel {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bet-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .bet-btn {
    width: 46px;
    height: 46px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    border-radius: 13px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, background .15s, border-color .15s, color .15s;
    font-family: inherit;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .bet-btn:hover:not(:disabled)  { background: var(--bg-panel); border-color: var(--gold); color: var(--gold); }
  .bet-btn:active:not(:disabled) { transform: scale(.92); }
  .bet-btn:disabled { opacity: .35; cursor: not-allowed; }

  .bet-input {
    width: 140px;
    height: 46px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 13px;
    color: var(--gold);
    font-size: 18px;
    font-weight: 900;
    text-align: center;
    outline: none;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color .2s, box-shadow .2s;
  }
  .bet-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(255,203,71,.25);
  }

  .quick-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .quick-btn {
    padding: 9px 13px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: color .15s, border-color .15s, transform .12s, background .15s;
    font-family: inherit;
    min-height: 36px;
    touch-action: manipulation;
    min-width: 52px;
  }
  .quick-btn:hover:not(:disabled)  { color: var(--gold); border-color: rgba(255,203,71,.5); background: rgba(255,203,71,.08); }
  .quick-btn:active:not(:disabled) { transform: scale(.94); }
  .quick-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* КРУГЛАЯ КНОПКА SPIN */
  .spin-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px 0 8px;
    flex-shrink: 0;
  }

  .spin-btn {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    background:
      radial-gradient(circle at 35% 25%, rgba(255,255,255,.35), transparent 50%),
      linear-gradient(145deg, #ffd76e 0%, #ff9a3d 50%, #c96a10 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
    box-shadow:
      0 10px 0 #7a3d00,
      0 14px 34px rgba(0,0,0,.6),
      0 0 60px rgba(255,203,71,.5),
      inset 0 5px 14px rgba(255,255,255,.4),
      inset 0 -4px 14px rgba(0,0,0,.2);
    font-family: inherit;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
    touch-action: manipulation;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }
  .spin-btn .spin-icon { font-size: 34px; }
  .spin-btn .spin-text { font-size: 12px; margin-top: 3px; letter-spacing: 3px; font-weight: 900; }

  .spin-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow:
      0 13px 0 #7a3d00,
      0 18px 44px rgba(0,0,0,.6),
      0 0 80px rgba(255,203,71,.7),
      inset 0 5px 14px rgba(255,255,255,.4),
      inset 0 -4px 14px rgba(0,0,0,.2);
  }
  .spin-btn:active:not(:disabled) {
    transform: translateY(5px);
    box-shadow: 0 5px 0 #7a3d00, 0 8px 24px rgba(0,0,0,.6), 0 0 40px rgba(255,203,71,.5);
  }
  .spin-btn:disabled {
    background: linear-gradient(145deg, #4a5a6a, #2a3a4a);
    box-shadow: 0 6px 0 #1a2634, 0 8px 20px rgba(0,0,0,.4);
    color: #7a8ea0;
    cursor: not-allowed;
  }
  .spin-btn.ready { animation: spinBtnPulse 2.2s ease-in-out infinite; }
  @keyframes spinBtnPulse {
    0%, 100% { box-shadow: 0 10px 0 #7a3d00, 0 14px 34px rgba(0,0,0,.6), 0 0 60px rgba(255,203,71,.5), inset 0 5px 14px rgba(255,255,255,.4), inset 0 -4px 14px rgba(0,0,0,.2); }
    50%      { box-shadow: 0 10px 0 #7a3d00, 0 14px 34px rgba(0,0,0,.6), 0 0 100px rgba(255,203,71,.85), inset 0 5px 14px rgba(255,255,255,.4), inset 0 -4px 14px rgba(0,0,0,.2); }
  }

  /* ============================================================
     НАВИГАЦИЯ — ТЕЛЕФОН (по умолчанию внизу)
     ============================================================ */
  .nav-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 12px;
    background: rgba(10,13,20,.95);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    flex-shrink: 0;
    z-index: 10;
    gap: 4px;
  }

  .nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 12px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: transform .12s, color .15s, background .15s;
    font-family: inherit;
    touch-action: manipulation;
    border-radius: 10px;
    position: relative;
    flex: 1;
    max-width: 90px;
    min-height: 52px;
  }
  .nav-btn .icon {
    font-size: 22px;
    line-height: 1;
    transition: transform .2s;
  }
  .nav-btn .label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
    line-height: 1;
  }
  .nav-btn:hover  { color: var(--text); background: rgba(255,255,255,.03); }
  .nav-btn:active { transform: scale(.94); }
  .nav-btn.active {
    color: var(--gold);
    background: rgba(255,203,71,.08);
  }
  .nav-btn.active .icon { transform: scale(1.1); }
  .nav-btn.active::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(255,203,71,.7);
  }
  .nav-btn .badge-dot {
    position: absolute;
    top: 4px; right: 50%;
    margin-right: -16px;
    width: 11px; height: 11px;
    background: var(--red);
    border-radius: 50%;
    border: 2px solid var(--bg-dark);
    animation: pulseDot 1.2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.2); }
  }

  /* ============================================================
     ПК: боковая навигация (от 900px)
     ============================================================ */
  @media (min-width: 900px) {
    .app {
      grid-template-columns: 90px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "nav top"
        "nav game";
    }

    .nav-bar {
      grid-area: nav;
      flex-direction: column;
      justify-content: flex-start;
      padding: 20px 8px;
      gap: 10px;
      border-top: none;
      border-right: 1px solid var(--border);
      min-height: 0;
      overflow-y: auto;
    }

    .nav-btn {
      width: 100%;
      max-width: none;
      flex: 0 0 auto;
      padding: 12px 6px;
      min-height: 64px;
    }

    .nav-btn .icon { font-size: 24px; }
    .nav-btn .label { font-size: 9px; }

    /* Активная вкладка — подсветка слева */
    .nav-btn.active::before {
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
      border-radius: 0 3px 3px 0;
    }

    .top-bar {
      grid-area: top;
      flex-direction: column;
      padding: 12px 20px 14px;
    }

    .game-zone {
      grid-area: game;
      padding: 24px;
      gap: 20px;
    }

    .machine-frame {
      max-width: 560px;
    }

    .bet-panel {
      max-width: 560px;
    }

    .cell {
      font-size: clamp(48px, 6vw, 74px);
    }

    .spin-btn {
      width: 116px;
      height: 116px;
    }
    .spin-btn .spin-icon { font-size: 38px; }
    .spin-btn .spin-text { font-size: 13px; }

    /* На ПК в шапке можно показать больше */
    .top-row-1 {
      justify-content: space-between;
    }
    .profile-name { max-width: 200px; }
  }

  /* ============================================================
     ОЧЕНЬ ШИРОКИЙ ПК (от 1400px) — сдвигаем игру в центр
     ============================================================ */
  @media (min-width: 1400px) {
    .game-zone {
      padding: 32px;
    }
  }

  /* ============================================================
     МОДАЛКИ
     ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 5, 10, .9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 400;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    padding: 12px;
    padding-top: calc(12px + var(--safe-top));
    padding-bottom: calc(12px + var(--safe-bottom));
    overscroll-behavior: contain;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal-card {
    background: linear-gradient(180deg, var(--bg-card), var(--bg-panel));
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 24px;
    max-width: 460px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    box-shadow: 0 32px 80px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);
    transform: scale(.92) translateY(10px);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    margin: auto;
  }
  .modal-overlay.show .modal-card { transform: scale(1) translateY(0); }

  .modal-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 18px;
    text-align: center;
  }

  .modal-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 34px; height: 34px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: var(--text-dim);
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: background .15s, color .15s, transform .12s, border-color .15s;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    z-index: 2;
  }
  .modal-close:hover  { background: var(--red); color: #fff; border-color: var(--red); }
  .modal-close:active { transform: scale(.92); }

  /* Таблица выплат */
  .paytable { display: flex; flex-direction: column; gap: 6px; }
  .pay-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 12px;
    font-size: 13px;
  }
  .pay-row.hit {
    background: rgba(255,203,71,.12);
    border-color: rgba(255,203,71,.5);
    box-shadow: 0 0 20px rgba(255,203,71,.25);
  }
  .pay-symbol { font-size: 20px; letter-spacing: 3px; }
  .pay-mult { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; }
  .pay-special { color: var(--purple); font-weight: 800; font-size: 12.5px; }

  /* Профиль */
  .profile-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 16px;
    background: linear-gradient(135deg, rgba(168,85,247,.12), rgba(255,203,71,.05));
    border: 1.5px solid rgba(168,85,247,.35);
    border-radius: 18px;
    margin-bottom: 20px;
  }
  .avatar-big {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    background: linear-gradient(145deg, #2a1f3d, #150d24);
    border: 4px solid var(--purple);
    box-shadow: 0 0 40px rgba(168,85,247,.6);
    transition: transform .2s;
  }
  .avatar-big:hover { transform: scale(1.05); }

  .nickname-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .nickname-display {
    font-size: 22px;
    font-weight: 900;
    color: var(--text);
    text-align: center;
    word-break: break-word;
  }
  .edit-nick-btn {
    padding: 7px 14px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 9px;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: .15s;
  }
  .edit-nick-btn:hover { color: var(--gold); border-color: rgba(255,203,71,.5); background: rgba(255,203,71,.08); }

  .nick-edit-form {
    display: none;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
  }
  .nick-edit-form.show { display: flex; }

  .nick-input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(15,20,29,.9);
    border: 1.5px solid var(--gold);
    border-radius: 11px;
    color: var(--text);
    font-size: 17px;
    font-weight: 800;
    text-align: center;
    outline: none;
    font-family: inherit;
    box-shadow: 0 0 20px rgba(255,203,71,.2);
  }
  .nick-input:focus { box-shadow: 0 0 28px rgba(255,203,71,.4); }

  .nick-buttons-row { display: flex; gap: 8px; }
  .nick-save-btn {
    flex: 1;
    padding: 11px 16px;
    background: linear-gradient(135deg, var(--gold), #ff9a3d);
    border: none;
    border-radius: 10px;
    color: #1a1206;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 0 rgba(0,0,0,.3), 0 0 20px rgba(255,203,71,.4);
  }
  .nick-save-btn:hover { transform: translateY(-2px); }
  .nick-save-btn:active { transform: translateY(1px); }
  .nick-save-btn:disabled { opacity: .5; cursor: not-allowed; }
  .nick-cancel-btn {
    padding: 11px 16px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .nick-hint { font-size: 10.5px; color: var(--text-dim); text-align: center; }
  .nick-hint.error { color: var(--red); }

  .profile-stats-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .profile-stat-chip {
    padding: 7px 14px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .profile-stat-chip b { color: var(--gold); margin-left: 2px; }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: var(--text-dim);
    font-weight: 800;
    margin: 18px 0 10px;
  }

  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .avatar-option {
    aspect-ratio: 1/1;
    background: rgba(255,255,255,.04);
    border: 2px solid rgba(255,255,255,.08);
    border-radius: 12px;
    font-size: 24px;
    cursor: pointer;
    transition: .15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .avatar-option:hover { transform: scale(1.08); border-color: rgba(255,203,71,.5); background: rgba(255,203,71,.08); }
  .avatar-option.selected {
    border-color: var(--gold);
    background: rgba(255,203,71,.15);
    box-shadow: 0 0 18px rgba(255,203,71,.5);
  }

  /* Дейлики */
  .daily-streak-big {
    text-align: center;
    padding: 18px;
    background: linear-gradient(135deg, rgba(255,203,71,.12), rgba(168,85,247,.08));
    border: 1.5px solid rgba(255,203,71,.35);
    border-radius: 16px;
    margin-bottom: 16px;
  }
  .daily-streak-big .num {
    font-size: 52px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .daily-streak-big .lbl {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-top: 8px;
    font-weight: 800;
  }
  .daily-streak-big .reward {
    font-size: 14px;
    color: var(--gold);
    font-weight: 800;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .daily-timeline {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 18px;
  }
  .daily-day {
    padding: 10px 3px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 9px;
    text-align: center;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text-dim);
    transition: .2s;
  }
  .daily-day.current {
    background: rgba(255,203,71,.15);
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 14px rgba(255,203,71,.4);
    transform: scale(1.06);
  }
  .daily-day.claimed {
    background: rgba(34,197,94,.12);
    border-color: rgba(34,197,94,.5);
    color: var(--green);
  }
  .daily-day .ic { font-size: 14px; display: block; margin-bottom: 4px; }
  .daily-day .day-num { font-size: 8px; opacity: .7; margin-top: 3px; }

  .daily-claim-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--gold), #ff9a3d);
    border: none;
    border-radius: 12px;
    color: #1a1206;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 0 rgba(0,0,0,.3), 0 0 30px rgba(255,203,71,.5);
    margin-bottom: 12px;
  }
  .daily-claim-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .daily-claim-btn:disabled { background: rgba(255,255,255,.05); color: var(--text-dim); cursor: not-allowed; box-shadow: none; }
  .daily-info { text-align: center; font-size: 11.5px; color: var(--text-dim); line-height: 1.6; }
  .daily-info b { color: var(--gold); }

  /* Статистика */
  .stats-section { margin-bottom: 20px; }
  .stats-section:last-child { margin-bottom: 0; }
  .stats-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: var(--text-dim);
    font-weight: 800;
    margin-bottom: 10px;
  }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-tile {
    padding: 12px 14px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 11px;
  }
  .stat-tile.full { grid-column: 1 / -1; }
  .stat-tile .lbl {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    font-weight: 800;
    margin-bottom: 5px;
  }
  .stat-tile .val {
    font-size: 17px;
    font-weight: 900;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .val.green  { color: var(--green); }
  .stat-tile .val.red    { color: var(--red); }
  .stat-tile .val.purple { color: var(--purple); }
  .stat-tile .val.small  { font-size: 14px; }
  .stat-tile .sub { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .winrate-bar {
    height: 8px;
    background: rgba(0,0,0,.5);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }
  .winrate-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), #16a34a);
    border-radius: 4px;
    transition: width .6s ease;
  }
  .mini-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 60px;
    margin-top: 10px;
    padding: 6px;
    background: rgba(0,0,0,.3);
    border-radius: 9px;
  }
  .mini-chart-bar {
    flex: 1;
    border-radius: 3px;
    transition: height .3s;
    min-height: 5px;
  }
  .mini-chart-bar.win  { background: linear-gradient(180deg, var(--green), #16a34a); }
  .mini-chart-bar.lose { background: linear-gradient(180deg, var(--red), #b91c1c); }

  /* Оверлей результата */
  .result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 5, 10, .85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    padding: 12px;
  }
  .result-overlay.show { opacity: 1; pointer-events: auto; }
  .result-card {
    background: linear-gradient(180deg, var(--bg-card), var(--bg-panel));
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 22px;
    padding: 26px 32px;
    text-align: center;
    min-width: 300px;
    max-width: 90vw;
    transform: scale(.85);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 30px 80px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .result-overlay.show .result-card { transform: scale(1); }
  .result-card.win  { border-color: rgba(255,203,71,.5); }
  .result-card.lose { border-color: rgba(255,255,255,.08); opacity: .94; }
  .result-card.big-win {
    border-color: rgba(255,203,71,.6);
    animation: bigWinPulse .9s ease-in-out infinite alternate;
  }
  @keyframes bigWinPulse {
    from { box-shadow: 0 30px 80px rgba(0,0,0,.8), 0 0 50px rgba(255,203,71,.4), inset 0 1px 0 rgba(255,255,255,.08); }
    to   { box-shadow: 0 30px 80px rgba(0,0,0,.8), 0 0 100px rgba(255,203,71,.8), inset 0 1px 0 rgba(255,255,255,.08); }
  }
  .result-title {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .result-card.win .result-title { color: var(--gold); }
  .result-symbols {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .result-sym {
    width: 62px; height: 62px;
    background: rgba(255,255,255,.03);
    border: 2px solid rgba(255,255,255,.08);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  .result-card.win .result-sym {
    border-color: var(--gold);
    box-shadow: 0 0 25px rgba(255,203,71,.6);
  }
  .result-info { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .result-row {
    display: flex; justify-content: space-between;
    padding: 8px 14px;
    background: rgba(255,255,255,.03);
    border-radius: 9px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .result-row b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; }
  .result-row.result-total {
    background: rgba(255,203,71,.1);
    border: 1px solid rgba(255,203,71,.4);
    padding: 11px 14px;
    font-size: 13.5px;
    color: var(--gold);
  }
  .result-row.result-total b { font-size: 20px; color: var(--gold); }
  .result-card.lose .result-row.result-total {
    background: rgba(239,68,68,.08);
    border-color: rgba(239,68,68,.4);
    color: var(--red);
  }
  .result-card.lose .result-row.result-total b { color: var(--red); }
  .result-hint {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2.5px;
    margin-top: 6px;
  }

  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    animation: particleFall 1.6s cubic-bezier(.2,.8,.4,1) forwards;
    font-size: 24px;
    filter: drop-shadow(0 0 8px rgba(255,203,71,.5));
  }
  @keyframes particleFall {
    0%   { opacity: 1; transform: translate3d(0, 0, 0) rotate(0); }
    100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot)); }
  }
  .firework {
    position: fixed;
    width: 7px; height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 700;
    animation: fw 1.6s ease-out forwards;
  }
  @keyframes fw {
    0%   { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
    100% { transform: translate3d(var(--fx), var(--fy), 0) scale(.3); opacity: 0; }
  }

  .levelup-popup {
    position: fixed;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    padding: 20px;
  }
  .levelup-popup.show { opacity: 1; pointer-events: auto; }
  .levelup-card {
    background: linear-gradient(135deg, #2a1f44, #150d24);
    border: 2px solid var(--purple);
    border-radius: 22px;
    padding: 30px 48px;
    text-align: center;
    animation: lvlUpScale .5s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 0 80px rgba(168,85,247,.7);
  }
  @keyframes lvlUpScale {
    from { transform: scale(.4); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }
  .levelup-card .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--purple);
    margin-bottom: 10px;
    font-weight: 900;
  }
  .levelup-card .num {
    font-size: 56px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .levelup-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 10px; }

  .toast {
    position: fixed;
    bottom: calc(90px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(22,28,40,.95);
    border: 1px solid rgba(255,203,71,.3);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 12px 40px rgba(0,0,0,.7), 0 0 30px rgba(255,203,71,.2);
    opacity: 0;
    transition: opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 300;
    pointer-events: none;
    max-width: calc(90vw - 20px);
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error {
    border-color: rgba(239,68,68,.5);
    box-shadow: 0 12px 40px rgba(0,0,0,.7), 0 0 30px rgba(239,68,68,.4);
  }

  @media (min-width: 900px) {
    .toast {
      bottom: calc(24px + var(--safe-bottom));
      left: calc(50% + 45px);
    }
  }

  /* ============================================================
     МОБИЛЬНАЯ АДАПТАЦИЯ
     ============================================================ */
  @media (max-width: 500px) {
    .top-bar { padding: 8px 10px 10px; gap: 8px; }
    .balance-hero { font-size: 16px; padding: 6px 14px; gap: 6px; }
    .balance-hero .coin { font-size: 17px; }
    .profile-badge { padding: 4px 12px 4px 4px; gap: 8px; }
    .avatar { width: 36px; height: 36px; font-size: 19px; }
    .profile-name { font-size: 12.5px; max-width: 95px; }
    .profile-level { font-size: 9.5px; }
    .mini-stat { padding: 4px 9px; min-width: 54px; }
    .mini-stat .lbl { font-size: 7.5px; }
    .mini-stat .val { font-size: 12px; }
    .machine-frame { padding: 14px; border-radius: 22px; }
    .reels { gap: 10px; }
    .cell { font-size: clamp(40px, 15vw, 58px); border-radius: 15px; }
    .bet-btn { width: 42px; height: 42px; font-size: 20px; }
    .bet-input { height: 42px; width: 120px; font-size: 16px; }
    .quick-btn { padding: 8px 10px; font-size: 11.5px; min-width: 46px; min-height: 34px; }
    .spin-btn { width: 96px; height: 96px; }
    .spin-btn .spin-icon { font-size: 30px; }
    .spin-btn .spin-text { font-size: 11px; }
    .nav-btn { padding: 6px 8px; min-height: 48px; }
    .nav-btn .icon { font-size: 20px; }
    .nav-btn .label { font-size: 8.5px; }
    .avatar-grid { grid-template-columns: repeat(5, 1fr); }
    .avatar-big { width: 84px; height: 84px; font-size: 44px; }
    .nickname-display { font-size: 19px; }
    .modal-card { padding: 20px 18px; border-radius: 20px; }
    .daily-streak-big { padding: 16px; }
    .daily-streak-big .num { font-size: 46px; }
  }

  @media (max-width: 360px) {
    .mini-stat { min-width: 46px; padding: 4px 7px; }
    .balance-hero { font-size: 15px; padding: 5px 10px; }
    .spin-btn { width: 88px; height: 88px; }
    .profile-name { max-width: 75px; }
    .nav-btn .label { display: none; }
    .nav-btn { min-height: 42px; }
  }

  @media (hover: none) {
    .nav-btn:hover { color: var(--text-dim); background: transparent; }
    .nav-btn.active:hover { color: var(--gold); background: rgba(255,203,71,.08); }
    .bet-btn:hover:not(:disabled) { background: var(--bg-card); border-color: var(--border); color: var(--text); }
    .quick-btn:hover:not(:disabled) { color: var(--text-dim); border-color: var(--border); background: var(--bg-card); }
    .spin-btn:hover:not(:disabled) { transform: none; }
    .avatar-option:hover { transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div id="parallax-bg"></div>

<div class="app">

  <!-- НАВИГАЦИЯ -->
  <nav class="nav-bar" id="navBar">
    <button class="nav-btn active" data-nav="game" type="button">
      <span class="icon">🎰</span>
      <span class="label">Игра</span>
    </button>
    <button class="nav-btn" data-nav="table" type="button">
      <span class="icon">📋</span>
      <span class="label">Выплаты</span>
    </button>
    <button class="nav-btn" data-nav="stats" type="button">
      <span class="icon">📊</span>
      <span class="label">Стата</span>
    </button>
    <button class="nav-btn" data-nav="daily" id="btnDaily" type="button">
      <span class="icon">📅</span>
      <span class="label">Дейлик</span>
    </button>
    <button class="nav-btn" data-nav="turbo" id="btnTurbo" type="button">
      <span class="icon">⚡</span>
      <span class="label">Турбо</span>
    </button>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->

<script>
'use strict';

/* ============================================================
   LUCKY SLOTS — адаптивная навигация
   ============================================================ */

const SYMBOLS = [
  { id: 'cherry',  emoji: '🍒', weight: 30, multiplier: 15     },
  { id: 'lemon',   emoji: '🍋', weight: 26, multiplier: 30     },
  { id: 'bell',    emoji: '🔔', weight: 17, multiplier: 75     },
  { id: 'diamond', emoji: '💎', weight: 11, multiplier: 250    },
  { id: 'seven',   emoji: '7️⃣', weight: 6,  multiplier: 1000   },
  { id: 'star',    emoji: '⭐', weight: 3,  multiplier: 5000   },
  { id: 'crown',   emoji: '👑', weight: 1,  multiplier: 25000  },
];
const WILD    = { id: 'wild',    emoji: '🃏', multiplier: 0 };
const SCATTER = { id: 'scatter', emoji: '🎁', multiplier: 0 };
const TOTAL_WEIGHT = SYMBOLS.reduce((s, x) => s + x.weight, 0);

const CFG = {
  WIN_CHANCE: 85,
  WILD_CHANCE: 12,
  SCATTER_CHANCE: 6,
  JACKPOT_CONTRIB: 0.02,
  START_BALANCE: 10000,
  START_JACKPOT: 10000,
  FREE_SPIN_COUNT: 10,
  FREE_SPIN_MAX: 10,
  FREE_SPIN_MULT: 5,
  DAY_MS: 24 * 60 * 60 * 1000,
  SAVE_INTERVAL: 3000,
  AUTOSAVE_DEBOUNCE: 800,
  MAX_SPIN_LOCK: 8000,
  SPIN_DEBOUNCE: 80,
  NICK_MAX: 16,
};

const SAVE_KEY = 'lucky_slots_adaptive_v1';
const SAVE_VERSION = 1;

const AVATARS = ['😎','🤠','👑','🐯','🦁','🐺','🦊','🐼','🐸','🐵','🦄','🐲','👽','🤖','👻','💀','🎃','🤡','🃏','💎','⭐','🔥','⚡','🌈'];
const FRAMES = [
  { id: 'purple', color: '#a855f7', shadow: 'rgba(168,85,247,.6)' },
  { id: 'gold',   color: '#ffcb47', shadow: 'rgba(255,203,71,.6)' },
  { id: 'green',  color: '#22c55e', shadow: 'rgba(34,197,94,.6)'  },
  { id: 'blue',   color: '#3b82f6', shadow: 'rgba(59,130,246,.6)' },
  { id: 'red',    color: '#ef4444', shadow: 'rgba(239,68,68,.6)'  },
  { id: 'pink',   color: '#ec4899', shadow: 'rgba(236,72,153,.6)' },
  { id: 'cyan',   color: '#06b6d4', shadow: 'rgba(6,182,212,.6)'  },
  { id: 'orange', color: '#f97316', shadow: 'rgba(249,115,22,.6)' },
];

function fmt(n) {
  n = Math.floor(n);
  if (n < 1e6)  return n.toLocaleString('ru-RU');
  if (n < 1e9)  return (n / 1e6).toFixed(2) + ' млн';
  if (n < 1e12) return (n / 1e9).toFixed(2) + ' млрд';
  if (n < 1e15) return (n / 1e12).toFixed(2) + ' трлн';
  if (n < 1e18) return (n / 1e15).toFixed(2) + ' Qa';
  return (n / 1e18).toFixed(2) + ' Qi';
}
function now() { return Date.now(); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function vibrate(pattern) { if ('vibrate' in navigator) { try { navigator.vibrate(pattern); } catch (e) {} } }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const defaultState = {
  balance: CFG.START_BALANCE,
  jackpot: CFG.START_JACKPOT,
  bet: 1000,
  spinning: false,
  spinLockTime: 0,
  turbo: false,
  reels: [null, null, null],
  freeSpins: 0,
  freeSpinAutoRunning: false,
  freeSpinTotalWon: 0,
  level: 1,
  xp: 0,
  totalSpins: 0,
  totalWins: 0,
  totalLosses: 0,
  totalWagered: 0,
  totalWon: 0,
  maxWin: 0,
  maxBalance: CFG.START_BALANCE,
  maxStreak: 0,
  currentStreak: 0,
  wildCount: 0,
  scatterCount: 0,
  crownCount: 0,
  diamondCount: 0,
  starCount: 0,
  sevenCount: 0,
  jackpotCount: 0,
  turboSpins: 0,
  freeSpinsPlayed: 0,
  sessionStart: now(),
  sessionSpins: 0,
  recentResults: [],
  dailyStreak: 0,
  dailyLastClaim: 0,
  dailyTotalClaimed: 0,
  dailyBestStreak: 0,
  nickname: 'Игрок',
  avatar: '😎',
  frame: 'purple',
  lastSaveTime: 0,
  saveVersion: SAVE_VERSION,
};
const state = { ...defaultState };

const $ = id => document.getElementById(id);
const dom = {
  balance: $('balance'),
  jackpot: $('jackpotValue'),
  levelNum: $('levelNum'),
  levelMini: $('levelMini'),
  xpFill: $('xpFill'),
  reels: $('reels'),
  spinBtn: $('spinBtn'),
  betInput: $('betInput'),
  betMinus: $('betMinus'),
  betPlus: $('betPlus'),
  paytable: $('paytable'),
  machine: $('machine'),
  fsBadge: $('freespinsBadge'),
  freeSpinsMini: $('freeSpinsMini'),
  toast: $('toast'),
  avatarMini: $('avatarMini'),
  nickMini: $('nickMini'),
  resultOverlay: $('resultOverlay'),
  resultCard: $('resultCard'),
  resultTitle: $('resultTitle'),
  resultSymbols: $('resultSymbols'),
  resultBet: $('resultBet'),
  resultMult: $('resultMult'),
  resultPayout: $('resultPayout'),
  levelupPopup: $('levelupPopup'),
  levelupNum: $('levelupNum'),
};
const cells = dom.reels.querySelectorAll('.cell');

let resultTimer = null;
let toastTimer = null;
let spinDebounceTimer = null;

/* ==== ПРОФИЛЬ ==== */
function getFrame(id) { return FRAMES.find(f => f.id === id) || FRAMES[0]; }
function applyProfileToMini() {
  const frame = getFrame(state.frame);
  dom.avatarMini.textContent = state.avatar;
  dom.avatarMini.style.borderColor = frame.color;
  dom.avatarMini.style.boxShadow = `0 0 14px ${frame.shadow}`;
  dom.nickMini.textContent = state.nickname;
  dom.levelMini.textContent = `⭐ Ур. ${state.level}`;
}
function renderProfileModal() {
  const pc = $('profileContent');
  if (!pc) return;
  const frame = getFrame(state.frame);
  pc.innerHTML = `
    <div class="profile-hero">
      <div class="avatar-big" style="border-color:${frame.color};box-shadow:0 0 40px ${frame.shadow}">${state.avatar}</div>
      <div class="nickname-row" id="nickRow">
        <div class="nickname-display">${escapeHtml(state.nickname)}</div>
        <button class="edit-nick-btn" id="editNickBtn" type="button">✏️ Изменить</button>
      </div>
      <div class="nick-edit-form" id="nickEditForm">
        <input class="nick-input" id="nickInput" type="text" maxlength="${CFG.NICK_MAX}" value="${escapeHtml(state.nickname)}" placeholder="Введи ник">
        <div class="nick-buttons-row">
          <button class="nick-save-btn" id="nickSaveBtn" type="button">💾 Сохранить</button>
          <button class="nick-cancel-btn" id="nickCancelBtn" type="button">Отмена</button>
        </div>
        <div class="nick-hint" id="nickHint">Максимум ${CFG.NICK_MAX} символов</div>
      </div>
      <div class="profile-stats-row">
        <div class="profile-stat-chip">⭐ Ур. <b>${state.level}</b></div>
        <div class="profile-stat-chip">🎰 <b>${fmt(state.totalSpins)}</b> спинов</div>
        <div class="profile-stat-chip">🏆 <b>${state.jackpotCount}</b> джекпотов</div>
      </div>
    </div>
    <div class="section-label">😎 Аватар</div>
    <div class="avatar-grid" id="avatarGrid">
      ${AVATARS.map(a => `<button class="avatar-option ${state.avatar === a ? 'selected' : ''}" data-avatar="${a}" type="button">${a}</button>`).join('')}
    </div>
  `;
  pc.querySelectorAll('.avatar-option').forEach(btn => {
    btn.addEventListener('click', () => {
      state.avatar = btn.dataset.avatar;
      renderProfileModal();
      applyProfileToMini();
      scheduleAutosave();
      vibrate(15);
    });
  });
  const editBtn = $('editNickBtn');
  const nickRow = $('nickRow');
  const nickForm = $('nickEditForm');
  const nickInput = $('nickInput');
  const nickSaveBtn = $('nickSaveBtn');
  const nickCancelBtn = $('nickCancelBtn');
  const nickHint = $('nickHint');
  if (editBtn) editBtn.addEventListener('click', () => {
    nickRow.style.display = 'none';
    nickForm.classList.add('show');
    setTimeout(() => { nickInput.focus(); nickInput.select(); }, 100);
  });
  if (nickCancelBtn) nickCancelBtn.addEventListener('click', () => {
    nickRow.style.display = 'flex';
    nickForm.classList.remove('show');
    nickHint.classList.remove('error');
    nickHint.textContent = `Максимум ${CFG.NICK_MAX} символов`;
  });
  if (nickSaveBtn) nickSaveBtn.addEventListener('click', () => saveNickname());
  if (nickInput) {
    nickInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveNickname(); }
      if (e.key === 'Escape') { nickCancelBtn.click(); }
    });
    nickInput.addEventListener('input', () => {
      const len = nickInput.value.length;
      if (len > CFG.NICK_MAX) {
        nickHint.textContent = `Слишком длинный: ${len} / ${CFG.NICK_MAX}`;
        nickHint.classList.add('error');
      } else {
        nickHint.textContent = `Максимум ${CFG.NICK_MAX} символов (${len}/${CFG.NICK_MAX})`;
        nickHint.classList.remove('error');
      }
    });
  }
  function saveNickname() {
    const val = nickInput.value.trim();
    if (!val) { nickHint.textContent = '❌ Ник не может быть пустым'; nickHint.classList.add('error'); nickInput.focus(); return; }
    if (val.length > CFG.NICK_MAX) { nickHint.textContent = `❌ Слишком длинный: ${val.length} / ${CFG.NICK_MAX}`; nickHint.classList.add('error'); nickInput.focus(); return; }
    state.nickname = val;
    applyProfileToMini();
    scheduleAutosave();
    showToast('✅ Ник обновлён!');
    vibrate([20, 15, 20]);
    renderProfileModal();
  }
}

/* ==== УРОВНИ ==== */
function xpForLevel(level) { return Math.floor(100 * Math.pow(1.35, Math.min(level, 500))); }
function updateLevelUI() {
  dom.levelNum.textContent = state.level;
  const need = xpForLevel(state.level);
  const percent = clamp((state.xp / need) * 100, 0, 100);
  dom.xpFill.style.width = percent + '%';
  applyProfileToMini();
}
function addXP(amount) {
  state.xp += amount;
  let leveled = false;
  let safety = 0;
  while (state.xp >= xpForLevel(state.level) && safety < 100) {
    state.xp -= xpForLevel(state.level);
    state.level++;
    leveled = true;
    safety++;
  }
  updateLevelUI();
  if (leveled) {
    dom.levelupNum.textContent = state.level;
    dom.levelupPopup.classList.add('show');
    setTimeout(() => dom.levelupPopup.classList.remove('show'), 2200);
    vibrate([30, 20, 30, 20, 60]);
  }
}

/* ==== UI ==== */
function updateBalance(anim) {
  dom.balance.textContent = fmt(state.balance);
  if (state.balance > state.maxBalance) state.maxBalance = state.balance;
  dom.balance.classList.remove('bump', 'win', 'lose');
  if (anim) {
    void dom.balance.offsetWidth;
    dom.balance.classList.add('bump');
    if (anim === 'win')  dom.balance.classList.add('win');
    if (anim === 'lose') dom.balance.classList.add('lose');
    setTimeout(() => dom.balance.classList.remove('bump', 'win', 'lose'), 400);
  }
}
function updateJackpot() { dom.jackpot.textContent = fmt(state.jackpot); }
function setBet(value) {
  let v = Math.floor(value);
  if (!isFinite(v) || isNaN(v) || v < 1) v = 1;
  if (v > state.balance) v = Math.max(1, Math.floor(state.balance));
  state.bet = v;
  dom.betInput.value = v;
  scheduleAutosave();
}
function bindBetControls() {
  dom.betMinus.addEventListener('click', () => setBet(state.bet - 1000));
  dom.betPlus.addEventListener('click',  () => setBet(state.bet + 1000));
  dom.betInput.addEventListener('input', () => {
    const v = parseInt(dom.betInput.value.replace(/\D/g, ''), 10);
    if (!isNaN(v)) state.bet = v;
  });
  dom.betInput.addEventListener('blur', () => setBet(state.bet));
  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.bet;
      if (v === 'max') setBet(state.balance);
      else setBet(parseInt(v, 10));
    });
  });
}

function renderPaytable() {
  const rows = [];
  rows.push(`<div class="pay-row" style="background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);"><span style="font-size:12px;color:#22c55e;font-weight:800;">🎁 ${CFG.FREE_SPIN_COUNT} ФРИСПИНОВ ×${CFG.FREE_SPIN_MULT}</span></div>`);
  rows.push(`<div class="pay-row"><span class="pay-symbol">🃏🃏🃏</span><span class="pay-special">ДЖЕКПОТ 💰</span></div>`);
  SYMBOLS.slice().sort((a, b) => b.multiplier - a.multiplier).forEach(s => {
    rows.push(`<div class="pay-row"><span class="pay-symbol">${s.emoji}${s.emoji}${s.emoji}</span><span class="pay-mult">×${s.multiplier.toLocaleString('ru-RU')}</span></div>`);
  });
  dom.paytable.innerHTML = rows.join('');
}

function randomSymbol() {
  let roll = Math.random() * TOTAL_WEIGHT;
  for (const s of SYMBOLS) { roll -= s.weight; if (roll <= 0) return s; }
  return SYMBOLS[0];
}
function generateResult() {
  if (Math.random() * 100 < CFG.SCATTER_CHANCE) return [SCATTER, SCATTER, SCATTER];
  if (Math.random() * 100 < CFG.WIN_CHANCE) {
    if (Math.random() * 100 < CFG.WILD_CHANCE) { const sym = randomSymbol(); return [WILD, sym, sym]; }
    const sym = randomSymbol();
    return [sym, sym, sym];
  }
  const pool = [...SYMBOLS];
  const result = [];
  for (let i = 0; i < 3; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    result.push(pool.splice(idx, 1)[0]);
  }
  return result;
}
function checkWin(reels) {
  if (reels.every(r => r.id === 'scatter')) return { type: 'scatter', symbol: SCATTER, multiplier: 0 };
  if (reels.every(r => r.id === 'wild'))    return { type: 'jackpot', symbol: WILD, multiplier: 0 };
  const nonWild = reels.filter(r => r.id !== 'wild' && r.id !== 'scatter');
  const wildCount = reels.filter(r => r.id === 'wild').length;
  if (wildCount === 2) return null;
  if (wildCount === 1 && nonWild.length === 2 && nonWild[0].id === nonWild[1].id)
    return { type: 'win', symbol: nonWild[0], multiplier: nonWild[0].multiplier };
  if (wildCount === 0 && nonWild.length === 3 && nonWild[0].id === nonWild[1].id && nonWild[1].id === nonWild[2].id)
    return { type: 'win', symbol: nonWild[0], multiplier: nonWild[0].multiplier };
  return null;
}
function renderReels() {
  cells.forEach((cell, i) => {
    const sym = state.reels[i];
    cell.textContent = sym ? sym.emoji : '';
    cell.classList.remove('win');
  });
}

function spin() {
  if (spinDebounceTimer) return;
  spinDebounceTimer = setTimeout(() => { spinDebounceTimer = null; }, CFG.SPIN_DEBOUNCE);
  if (state.spinning) return;
  if (state.spinLockTime && now() - state.spinLockTime > CFG.MAX_SPIN_LOCK) {
    state.spinning = false; state.spinLockTime = 0; lockUI(false);
  }
  const isFree = state.freeSpins > 0;
  if (!isFree && state.balance < state.bet) { showToast('Недостаточно средств', true); return; }
  state.spinning = true;
  state.spinLockTime = now();
  lockUI(true);
  if (!isFree) {
    state.balance -= state.bet;
    state.totalWagered += state.bet;
    state.jackpot += Math.floor(state.bet * CFG.JACKPOT_CONTRIB);
    updateBalance('lose');
    updateJackpot();
    if (state.turbo) state.turboSpins++;
    vibrate(15);
  }
  state.totalSpins++;
  state.sessionSpins++;
  const result = generateResult();
  hideResult();
  const baseSpeed = state.turbo ? 0.4 : 1;
  const stopTimers = [600 * baseSpeed, 850 * baseSpeed, 1100 * baseSpeed];
  const blobIntervals = [];
  const tickInterval = state.turbo ? 40 : 60;
  cells.forEach((cell, i) => {
    cell.classList.add('spinning');
    cell.classList.remove('win');
    const interval = setInterval(() => { cell.textContent = randomSymbol().emoji; }, tickInterval);
    blobIntervals.push(interval);
    setTimeout(() => {
      if (blobIntervals[i]) clearInterval(blobIntervals[i]);
      cell.classList.remove('spinning');
      cell.textContent = result[i].emoji;
    }, stopTimers[i]);
  });
  setTimeout(() => {
    blobIntervals.forEach(clearInterval);
    cells.forEach((cell, i) => {
      cell.classList.remove('spinning');
      cell.textContent = result[i].emoji;
    });
    state.reels = result;
    resolveResult(result, isFree);
  }, Math.max(...stopTimers) + 30);
}

function resolveResult(result, isFree) {
  const win = checkWin(result);
  let payout = 0, multiplier = 0, displayMult = 0, type = 'lose';
  result.forEach(r => {
    if (r.id === 'wild')    state.wildCount++;
    if (r.id === 'scatter') state.scatterCount++;
  });
  if (win && win.type === 'scatter') {
    state.freeSpins = CFG.FREE_SPIN_MAX;
    state.freeSpinTotalWon = 0;
    updateFsBadge();
    updateFreeSpinsMini();
    showToast(`🎁 БОНУС! ${CFG.FREE_SPIN_COUNT} фриспинов ×${CFG.FREE_SPIN_MULT}!`);
    vibrate([40, 30, 40]);
    finishSpin(0, 0, result, 'scatter', 0);
    setTimeout(() => startFreeSpinAuto(), 1800);
    scheduleAutosave();
    return;
  }
  if (win && win.type === 'jackpot') {
    const levelBonus = 1 + (state.level - 1) * 0.05;
    payout = Math.floor(state.jackpot * levelBonus);
    multiplier = 5000;
    displayMult = 5000;
    state.balance += payout;
    state.totalWon += payout;
    state.jackpotCount++;
    state.jackpot = CFG.START_JACKPOT;
    if (payout > state.maxWin) state.maxWin = payout;
    updateBalance('win');
    updateJackpot();
    dom.machine.classList.add('shake');
    setTimeout(() => dom.machine.classList.remove('shake'), 600);
    spawnParticles(40, ['💰', '💎', '👑', '🏆']);
    vibrate([80, 40, 80, 40, 120]);
    addXP(200);
    finishSpin(payout, displayMult, result, 'jackpot', multiplier);
    scheduleAutosave();
    return;
  }
  if (win && win.type === 'win') {
    multiplier = win.multiplier;
    const fsMult = isFree ? CFG.FREE_SPIN_MULT : 1;
    const levelBonus = 1 + (state.level - 1) * 0.05;
    displayMult = multiplier * fsMult * levelBonus;
    payout = Math.floor(state.bet * multiplier * fsMult * levelBonus);
    state.balance += payout;
    state.totalWon += payout;
    if (isFree) state.freeSpinTotalWon += payout;
    if (payout > state.maxWin) state.maxWin = payout;
    if (win.symbol.id === 'crown')   state.crownCount++;
    if (win.symbol.id === 'diamond') state.diamondCount++;
    if (win.symbol.id === 'star')    state.starCount++;
    if (win.symbol.id === 'seven')   state.sevenCount++;
    updateBalance('win');
    cells.forEach(c => c.classList.add('win'));
    if (multiplier >= 5000) {
      spawnParticles(30, ['⭐', '💎', '✨']);
      dom.machine.classList.add('shake');
      setTimeout(() => dom.machine.classList.remove('shake'), 600);
      if (multiplier >= 25000) spawnFirework();
      vibrate([60, 30, 60]);
      type = 'mega';
    } else if (multiplier >= 250) {
      spawnParticles(15, ['✨', '⭐']);
      vibrate(40);
      type = 'bigwin';
    } else {
      vibrate(20);
      type = 'win';
    }
    if (isFree) type = 'fs';
    state.currentStreak++;
    if (state.currentStreak > state.maxStreak) state.maxStreak = state.currentStreak;
    state.totalWins++;
    addXP(Math.max(1, Math.floor(Math.log10(payout + 1)) * 5));
    finishSpin(payout, displayMult, result, type, multiplier);
    scheduleAutosave();
    return;
  }
  state.currentStreak = 0;
  state.totalLosses++;
  addXP(1);
  finishSpin(0, 0, result, 'lose', 0);
  scheduleAutosave();
}

function finishSpin(payout, displayMult, result, type, multiplier) {
  state.spinning = false;
  state.spinLockTime = 0;
  lockUI(false);
  state.recentResults.push({ payout, bet: state.bet });
  if (state.recentResults.length > 20) state.recentResults.shift();
  showResult(result, state.bet, displayMult, payout, type);
  const wasFree = state.freeSpins > 0;
  if (wasFree) {
    state.freeSpins--;
    state.freeSpinsPlayed++;
    updateFsBadge();
    updateFreeSpinsMini();
  }
  if (state.freeSpinAutoRunning && state.freeSpins > 0) {
    setTimeout(() => {
      if (state.freeSpinAutoRunning && !state.spinning && state.freeSpins > 0) spin();
    }, state.turbo ? 700 : 1200);
    return;
  }
  if (state.freeSpinAutoRunning && state.freeSpins === 0) {
    state.freeSpinAutoRunning = false;
    const won = state.freeSpinTotalWon;
    setTimeout(() => {
      if (won > 0) { showToast(`🎁 Фриспины завершены! Итого: +${fmt(won)}`); spawnParticles(25, ['🎁', '✨', '💰']); }
      else { showToast('🎁 Фриспины завершены'); }
    }, 600);
    state.freeSpinTotalWon = 0;
  }
}

function startFreeSpinAuto() {
  if (state.freeSpins <= 0 || state.spinning) return;
  state.freeSpinAutoRunning = true;
  showToast(`🎁 АВТО-ПРОКРУТ ${state.freeSpins} СПИНОВ ×${CFG.FREE_SPIN_MULT}!`);
  spin();
}
function lockUI(locked) {
  dom.spinBtn.disabled = locked;
  dom.betMinus.disabled = locked;
  dom.betPlus.disabled = locked;
  dom.betInput.disabled = locked;
  document.querySelectorAll('.quick-btn').forEach(b => b.disabled = locked);
  dom.spinBtn.classList.toggle('ready', !locked);
}
function updateFsBadge() {
  if (state.freeSpins > 0) {
    dom.fsBadge.innerHTML = `🎁 ${state.freeSpins} ×${CFG.FREE_SPIN_MULT}`;
    dom.fsBadge.classList.add('show');
  } else dom.fsBadge.classList.remove('show');
}
function updateFreeSpinsMini() { if (dom.freeSpinsMini) dom.freeSpinsMini.textContent = state.freeSpins; }

function showResult(symbols, bet, multiplier, payout, type) {
  const isScatter = type === 'scatter';
  const isJackpot = type === 'jackpot';
  const isMega = type === 'mega';
  const isBigWin = type === 'bigwin';
  const isFs = type === 'fs';
  const isWin = payout > 0 && !isScatter;
  if (isJackpot)      dom.resultTitle.textContent = '💥 ДЖЕКПОТ!!! 💥';
  else if (isScatter) dom.resultTitle.textContent = '🎁 БОНУС!';
  else if (isFs)      dom.resultTitle.textContent = `🎁 ФРИСПИН ×${CFG.FREE_SPIN_MULT}`;
  else if (isMega)    dom.resultTitle.textContent = '💥 МЕГА-ВЫИГРЫШ!';
  else if (isBigWin)  dom.resultTitle.textContent = '🏆 БОЛЬШОЙ ВЫИГРЫШ!';
  else if (isWin)     dom.resultTitle.textContent = 'ВЫИГРЫШ';
  else                dom.resultTitle.textContent = 'ПРОИГРЫШ';
  dom.resultCard.classList.remove('win', 'lose', 'big-win');
  if (isJackpot || isMega) dom.resultCard.classList.add('win', 'big-win');
  else if (isBigWin)       dom.resultCard.classList.add('win', 'big-win');
  else if (isWin || isFs)  dom.resultCard.classList.add('win');
  else                     dom.resultCard.classList.add('lose');
  const symEls = dom.resultSymbols.querySelectorAll('.result-sym');
  symEls.forEach((el, i) => { el.textContent = symbols[i] ? symbols[i].emoji : ''; });
  dom.resultBet.textContent = fmt(bet);
  if (isScatter) { dom.resultMult.textContent = '🎁 БОНУС'; dom.resultPayout.textContent = `+${CFG.FREE_SPIN_COUNT} FS`; }
  else if (isJackpot) { dom.resultMult.textContent = '×5000'; dom.resultPayout.textContent = `+${fmt(payout)}`; }
  else if (isWin) { dom.resultMult.textContent = `×${Math.round(multiplier).toLocaleString('ru-RU')}`; dom.resultPayout.textContent = `+${fmt(payout)}`; }
  else { dom.resultMult.textContent = '—'; dom.resultPayout.textContent = `−${fmt(bet)}`; }
  dom.resultOverlay.classList.add('show');
  clearTimeout(resultTimer);
  const dur = (isJackpot || isMega) ? 3500 : (isScatter ? 2500 : 2000);
  if (state.freeSpinAutoRunning) {
    const fastDur = (isJackpot || isMega) ? 1500 : (isScatter ? 1800 : 700);
    resultTimer = setTimeout(() => dom.resultOverlay.classList.remove('show'), fastDur);
  } else {
    resultTimer = setTimeout(() => dom.resultOverlay.classList.remove('show'), dur);
  }
}
function hideResult() { clearTimeout(resultTimer); dom.resultOverlay.classList.remove('show'); }

function spawnParticles(count, emojis) {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = Math.random() * Math.PI * 2, dist = 200 + Math.random() * 400;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.setProperty('--rot', (Math.random() - 0.5) * 720 + 'deg');
    p.style.fontSize = (16 + Math.random() * 22) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}
function spawnFirework() {
  const colors = ['#ff5c5c', '#ffcb47', '#22c55e', '#3b82f6', '#a855f7'];
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'firework';
    const c = colors[Math.floor(Math.random() * colors.length)];
    p.style.background = c;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    const angle = Math.random() * Math.PI * 2, dist = 100 + Math.random() * 500;
    p.style.setProperty('--fx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--fy', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}
function showToast(text, isError) {
  dom.toast.textContent = text;
  dom.toast.classList.toggle('error', !!isError);
  dom.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => dom.toast.classList.remove('show'), 2200);
}

function dailyReward(streak) { return Math.floor(50000 * Math.pow(1.5, streak - 1)); }
function daysSinceLastClaim() { if (!state.dailyLastClaim) return Infinity; return (now() - state.dailyLastClaim) / CFG.DAY_MS; }
function canClaimDaily() { return daysSinceLastClaim() >= 1; }
function claimDailyReward() {
  if (!canClaimDaily()) return;
  if (daysSinceLastClaim() > 2 && state.dailyLastClaim > 0) state.dailyStreak = 0;
  state.dailyStreak++;
  if (state.dailyStreak > state.dailyBestStreak) state.dailyBestStreak = state.dailyStreak;
  state.dailyLastClaim = now();
  const reward = dailyReward(state.dailyStreak);
  state.balance += reward;
  state.totalWon += reward;
  state.dailyTotalClaimed++;
  updateBalance('win');
  spawnParticles(25, ['📅', '💰', '✨', '🎁']);
  showToast(`📅 День ${state.dailyStreak}! +${fmt(reward)} 🪙`);
  vibrate([40, 30, 40, 30, 80]);
  if (state.dailyStreak % 7 === 0) {
    spawnFirework();
    setTimeout(() => showToast(`🔥 ${state.dailyStreak} дней подряд — огонь!`), 2300);
  }
  saveGame();
  renderDailyModal();
  updateDailyBadge();
}
function updateDailyBadge() {
  const btn = $('btnDaily');
  if (!btn) return;
  const existing = btn.querySelector('.badge-dot');
  if (canClaimDaily() && !existing) {
    const dot = document.createElement('div');
    dot.className = 'badge-dot';
    btn.appendChild(dot);
  } else if (!canClaimDaily() && existing) existing.remove();
}
function renderDailyModal() {
  const dc = $('dailyContent');
  if (!dc) return;
  const can = canClaimDaily();
  const streak = state.dailyStreak;
  const nextStreak = can ? streak + 1 : streak;
  const nextReward = dailyReward(nextStreak);
  const startDay = Math.floor(streak / 7) * 7;
  const days = [];
  for (let i = 1; i <= 7; i++) {
    const dayNum = startDay + i;
    days.push({ day: dayNum, reward: dailyReward(dayNum), claimed: dayNum <= streak, current: dayNum === nextStreak && can });
  }
  let timeLeft = '';
  if (!can && state.dailyLastClaim) {
    const msLeft = CFG.DAY_MS - (now() - state.dailyLastClaim);
    const hoursLeft = Math.floor(msLeft / 3600000);
    const minsLeft = Math.floor((msLeft % 3600000) / 60000);
    timeLeft = `${hoursLeft}ч ${minsLeft}м`;
  }
  dc.innerHTML = `
    <div class="daily-streak-big">
      <div class="num">${streak}</div>
      <div class="lbl">Дней подряд</div>
      <div class="reward">Следующая: +${fmt(nextReward)} 🪙</div>
    </div>
    <div class="daily-timeline">
      ${days.map(d => `<div class="daily-day ${d.claimed ? 'claimed' : ''} ${d.current ? 'current' : ''}"><span class="ic">${d.claimed ? '✓' : '🎁'}</span>Д${d.day}<div class="day-num">${fmt(d.reward)}</div></div>`).join('')}
    </div>
    <button class="daily-claim-btn" id="claimDailyBtn" type="button" ${can ? '' : 'disabled'}>
      ${can ? `🎁 ЗАБРАТЬ +${fmt(nextReward)} 🪙` : `⏳ Через ${timeLeft}`}
    </button>
    <div class="daily-info">
      <div>🏆 Лучший стрик: <b>${state.dailyBestStreak}</b> дней</div>
      <div>💎 Всего получено: <b>${fmt(state.dailyTotalClaimed)}</b> наград</div>
      <div style="margin-top:8px;font-size:10.5px;">Каждый день награда растёт ×1.5.<br>Пропустишь 2 дня — стрик сбросится.</div>
    </div>
  `;
  if (can) { const btn = $('claimDailyBtn'); if (btn) btn.addEventListener('click', claimDailyReward); }
}

let autosaveTimer = null;
let lastSaveAttempt = 0;
function scheduleAutosave() {
  if (autosaveTimer) return;
  autosaveTimer = setTimeout(() => { autosaveTimer = null; saveGame(); }, CFG.AUTOSAVE_DEBOUNCE);
}
function saveGame() {
  const t = now();
  if (t - lastSaveAttempt < 100) return;
  lastSaveAttempt = t;
  try {
    const data = { ...state, lastSaveTime: t, saveVersion: SAVE_VERSION, spinning: false, spinLockTime: 0, freeSpinAutoRunning: false, freeSpins: 0, reels: null, recentResults: state.recentResults.slice(-20) };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return false;
    Object.keys(defaultState).forEach(k => {
      if (k in data && data[k] !== null && data[k] !== undefined) {
        const expectedType = typeof defaultState[k], gotType = typeof data[k];
        if (expectedType === gotType || (Array.isArray(defaultState[k]) && Array.isArray(data[k]))) state[k] = data[k];
      }
    });
    state.balance = clamp(Number(state.balance) || CFG.START_BALANCE, 0, Number.MAX_SAFE_INTEGER);
    state.jackpot = clamp(Number(state.jackpot) || CFG.START_JACKPOT, 0, Number.MAX_SAFE_INTEGER);
    state.bet = clamp(Number(state.bet) || 1000, 1, Math.max(1, state.balance));
    state.level = clamp(Number(state.level) || 1, 1, 100000);
    state.xp = clamp(Number(state.xp) || 0, 0, Number.MAX_SAFE_INTEGER);
    state.nickname = String(state.nickname || 'Игрок').slice(0, CFG.NICK_MAX) || 'Игрок';
    state.avatar = AVATARS.includes(state.avatar) ? state.avatar : '😎';
    state.frame = FRAMES.some(f => f.id === state.frame) ? state.frame : 'purple';
    state.spinning = false; state.spinLockTime = 0;
    state.freeSpins = 0; state.freeSpinAutoRunning = false;
    state.sessionStart = now(); state.sessionSpins = 0;
    if (!state.reels || !state.reels[0] || !state.reels[0].emoji) state.reels = [SYMBOLS[0], SYMBOLS[1], SYMBOLS[2]];
    if (!Array.isArray(state.recentResults)) state.recentResults = [];
    return true;
  } catch (e) { return false; }
}

function bindButtons() {
  dom.spinBtn.addEventListener('click', () => spin());

  $('btnTurbo').addEventListener('click', () => {
    state.turbo = !state.turbo;
    $('btnTurbo').classList.toggle('active', state.turbo);
    showToast(state.turbo ? '⚡ Турбо ВКЛ' : 'Турбо ВЫКЛ');
    scheduleAutosave();
  });

  $('btnDaily').addEventListener('click', () => { renderDailyModal(); $('dailyModal').classList.add('show'); });
  $('btnProfile').addEventListener('click', () => { renderProfileModal(); $('profileModal').classList.add('show'); });

  // Навигация
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const nav = btn.dataset.nav;
      if (nav === 'game') {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      if (nav === 'table') { $('tableModal').classList.add('show'); }
      if (nav === 'stats') { renderStatsModal(); $('statsModal').classList.add('show'); }
    });
  });

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.close;
      const el = document.getElementById(id);
      if (el) el.classList.remove('show');
    });
  });
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });
  });
  dom.resultOverlay.addEventListener('click', hideResult);

  document.addEventListener('keydown', (e) => {
    if (document.activeElement === dom.betInput) return;
    if (document.activeElement.tagName === 'INPUT') return;
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault();
      if (dom.resultOverlay.classList.contains('show')) { hideResult(); return; }
      if (document.querySelector('.modal-overlay.show')) return;
      spin();
    }
    if (e.code === 'Escape') {
      if (dom.resultOverlay.classList.contains('show')) hideResult();
      document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveGame();
    else updateDailyBadge();
  });

  let touchStartY = 0, touchStartTime = 0;
  dom.reels.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartY = e.touches[0].clientY;
    touchStartTime = now();
  }, { passive: true });
  dom.reels.addEventListener('touchend', (e) => {
    if (e.changedTouches.length !== 1) return;
    const touchEndY = e.changedTouches[0].clientY;
    const diff = touchStartY - touchEndY;
    const dt = now() - touchStartTime;
    if (diff > 60 && dt < 500 && !state.spinning && !document.querySelector('.modal-overlay.show')) spin();
  }, { passive: true });

  setInterval(saveGame, CFG.SAVE_INTERVAL);
  window.addEventListener('beforeunload', saveGame);
  window.addEventListener('pagehide', saveGame);
}

setInterval(updateDailyBadge, 30000);

function init() {
  const loaded = loadGame();
  renderPaytable();
  bindBetControls();
  bindButtons();
  setBet(state.bet);
  updateBalance();
  updateJackpot();
  updateLevelUI();
  updateFsBadge();
  updateFreeSpinsMini();
  updateDailyBadge();
  applyProfileToMini();
  if (!state.reels || !state.reels[0] || !state.reels[0].emoji) state.reels = [randomSymbol(), randomSymbol(), randomSymbol()];
  renderReels();
  $('btnTurbo').classList.toggle('active', state.turbo);

  if (loaded) setTimeout(() => showToast('💾 Прогресс загружен!'), 400);
  else setTimeout(() => showToast('🎰 Добро пожаловать!'), 400);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
