<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой ИИ Помощник</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef2f5; font-family: 'Segoe UI', Arial, sans-serif; }
  .chat { width: 100%; max-width: 600px; height: 85vh; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
  .header { background: #007bff; color: #fff; padding: 16px 20px; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: #f8f9fa; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 16px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
  .bot { align-self: flex-start; background: #fff; color: #333; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: #007bff; color: #fff; border-bottom-right-radius: 4px; }
  .input-row { display: flex; padding: 16px; gap: 10px; background: #fff; border-top: 1px solid #eee; }
  input[type=text] { flex: 1; padding: 14px 20px; border: 1px solid #ccc; border-radius: 30px; outline: none; font-size: 16px; transition: 0.2s; }
  input[type=text]:focus { border-color: #007bff; }
  button { padding: 0 24px; border: none; border-radius: 30px; background: #007bff; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  button:hover { background: #0056b3; }
  button:disabled { background: #a0c4ff; cursor: not-allowed; }
  .typing { font-style: italic; color: #888; }
</style>
</head>
<body>
<div class="chat">
  <div class="header"><span class="dot"></span> ИИ Помощник</div>
  <div class="messages" id="messages">
    <div class="msg bot">Привет! Я твой умный ИИ-помощник. Могу помочь с учёбой, кодом или просто поболтать. Спрашивай! 🧠✨</div>
  </div>
  <div class="input-row">
    <input type="text" id="input" placeholder="Напиши вопрос..." autocomplete="off">
    <button id="send" type="button" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let chatHistory = [];

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;
  const typing = addMessage("Думает...", 'bot typing');

  // Настройка характера
  if (chatHistory.length === 0) {
    chatHistory.push({ 
      role: "system", 
      content: "Ты — вежливый, умный и полезный ИИ-помощник. Отвечай на русском языке, подробно и структурированно. Помогай с кодом, объясняй сложные вещи простыми словами." 
    });
  }

  chatHistory.push({ role: "user", content: text });

  // Добавляем таймер на 15 секунд (чтобы не ждать вечно)
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);

  try {
    // Используем KeylessAI
    const response = await fetch("https://keylessai.thryx.workers.dev/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal, // Привязываем таймер
      body: JSON.stringify({
        model: "gpt-4o", 
        messages: chatHistory
      })
    });

    clearTimeout(timeoutId); // Останавливаем таймер, если ответ пришел

    if (!response.ok) throw new Error("Сервер перегружен, попробуй еще раз.");

    const data = await response.json();
    const botReply = data.choices[0].message.content;

    typing.remove();
    addMessage(botReply, 'bot');
    chatHistory.push({ role: "assistant", content: botReply });

  } catch (error) {
    clearTimeout(timeoutId);
    typing.remove();
    
    // Если сработал таймер
    if (error.name === 'AbortError') {
      addMessage("⚠️ Сервер слишком долго не отвечает. Попробуй написать еще раз.", 'bot');
    } else {
      addMessage("⚠️ Ошибка: " + error.message, 'bot');
    }
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
